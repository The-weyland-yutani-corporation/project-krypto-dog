name: Azure infra validate

# Template-compile-only validation of every Bicep entry point, module, and
# .bicepparam file under infra/ (see infra/README.md "Validation"). This
# workflow never authenticates to Azure (no azure/login, no OIDC, no
# federated credential, no real secret) -- `az bicep build` and
# `az bicep build-params` are both fully local, offline operations against
# the Azure CLI's bundled Bicep compiler and ARM resource-provider schemas.
# The stub values below are deliberately inert placeholders (never a real
# connection string, key, or password) supplied only so that
# `readEnvironmentVariable()` calls in the .bicepparam files have
# *something* to resolve to for type-checking -- see infra/README.md
# "Secure parameters" and "CI/local template-compile-only validation".
#
# Docker image targets are intentionally NOT validated here -- that
# happens in the main CI pipeline's docker-validate job (.github/workflows/
# ci.yml), gated to skip docs-only changes, so this PR-facing infra check
# stays fast and Bicep-only.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/azure-infra-validate.yml"
  workflow_dispatch:

concurrency:
  group: azure-infra-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Deliberately inert, non-secret stub values -- shell-scoped environment
# variables only, never written into a .bicepparam file, and never used
# for any authenticated Azure call in this workflow (there is none).
env:
  POSTGRES_ADMIN_PASSWORD_DEV: stub-inert-value
  POSTGRES_ADMIN_PASSWORD_PROD: stub-inert-value
  DATABASE_URL_DEV: stub-inert-value
  DIRECT_URL_DEV: stub-inert-value
  MIGRATION_URL_DEV: stub-inert-value
  CRON_SECRET_DEV: stub-inert-value
  POSTHOG_API_KEY_DEV: stub-inert-value
  ADMIN_ENTRA_CLIENT_SECRET_DEV: stub-inert-value
  ADMIN_ENTRA_TENANT_ID_DEV: 11111111-1111-4111-8111-111111111111
  ADMIN_ENTRA_CLIENT_ID_DEV: 22222222-2222-4222-8222-222222222222
  ADMIN_ENTRA_AUDIENCE_DEV: 22222222-2222-4222-8222-222222222222
  ADMIN_ENTRA_OPERATOR_ALLOWLIST_DEV: '[{"id":"33333333-3333-4333-8333-333333333333","name":"Stub Operator","role":"RELEASE_OWNER"}]'
  ADMIN_ENTRA_MFA_AUTH_CONTEXT_DEV: c1
  ADMIN_ENTRA_STEP_UP_AUTH_CONTEXT_DEV: c2
  ADMIN_AUTH_NOT_BEFORE_DEV: '1970-01-01T00:00:00.000Z'
  ADMIN_AUTH_POLICY_VERSION_DEV: stub-v1
  RUNTIME_DATABASE_PASSWORD_DEV: stub-inert-value
  MIGRATOR_DATABASE_PASSWORD_DEV: stub-inert-value
  DEPLOYMENT_APPROVAL_SECRET_DEV: stub-inert-value
  SAFETY_PRIMARY_ON_CALL_DEV: stub-primary
  SAFETY_BACKUP_ON_CALL_DEV: stub-backup
  SAFETY_RELEASE_OWNER_DEV: stub-release-owner
  SAFETY_APPROVER_DEV: stub-safety-approver
  SAFETY_EVIDENCE_CUSTODIAN_DEV: stub-evidence-custodian
  SAFETY_ROLLBACK_OWNER_DEV: stub-rollback-owner
  SAFETY_PRIMARY_ON_CALL_PUBLIC_KEY_DEV: stub-primary-key
  SAFETY_BACKUP_ON_CALL_PUBLIC_KEY_DEV: stub-backup-key
  SAFETY_RELEASE_OWNER_PUBLIC_KEY_DEV: stub-release-key
  SAFETY_APPROVER_PUBLIC_KEY_DEV: stub-approver-key
  SAFETY_EVIDENCE_CUSTODIAN_PUBLIC_KEY_DEV: stub-custodian-key
  SAFETY_ROLLBACK_OWNER_PUBLIC_KEY_DEV: stub-rollback-key
  DATABASE_URL_PROD: stub-inert-value
  DIRECT_URL_PROD: stub-inert-value
  MIGRATION_URL_PROD: stub-inert-value
  CRON_SECRET_PROD: stub-inert-value
  POSTHOG_API_KEY_PROD: stub-inert-value
  ADMIN_ENTRA_CLIENT_SECRET_PROD: stub-inert-value
  ADMIN_ENTRA_TENANT_ID_PROD: 44444444-4444-4444-8444-444444444444
  ADMIN_ENTRA_CLIENT_ID_PROD: 55555555-5555-4555-8555-555555555555
  ADMIN_ENTRA_AUDIENCE_PROD: 55555555-5555-4555-8555-555555555555
  ADMIN_ENTRA_OPERATOR_ALLOWLIST_PROD: '[{"id":"66666666-6666-4666-8666-666666666666","name":"Stub Operator","role":"RELEASE_OWNER"}]'
  ADMIN_ENTRA_MFA_AUTH_CONTEXT_PROD: c1
  ADMIN_ENTRA_STEP_UP_AUTH_CONTEXT_PROD: c2
  ADMIN_AUTH_NOT_BEFORE_PROD: '1970-01-01T00:00:00.000Z'
  ADMIN_AUTH_POLICY_VERSION_PROD: stub-v1
  RUNTIME_DATABASE_PASSWORD_PROD: stub-inert-value
  MIGRATOR_DATABASE_PASSWORD_PROD: stub-inert-value
  DEPLOYMENT_APPROVAL_SECRET_PROD: stub-inert-value
  SAFETY_PRIMARY_ON_CALL_PROD: stub-primary
  SAFETY_BACKUP_ON_CALL_PROD: stub-backup
  SAFETY_RELEASE_OWNER_PROD: stub-release-owner
  SAFETY_APPROVER_PROD: stub-safety-approver
  SAFETY_EVIDENCE_CUSTODIAN_PROD: stub-evidence-custodian
  SAFETY_ROLLBACK_OWNER_PROD: stub-rollback-owner
  SAFETY_PRIMARY_ON_CALL_PUBLIC_KEY_PROD: stub-primary-key
  SAFETY_BACKUP_ON_CALL_PUBLIC_KEY_PROD: stub-backup-key
  SAFETY_RELEASE_OWNER_PUBLIC_KEY_PROD: stub-release-key
  SAFETY_APPROVER_PUBLIC_KEY_PROD: stub-approver-key
  SAFETY_EVIDENCE_CUSTODIAN_PUBLIC_KEY_PROD: stub-custodian-key
  SAFETY_ROLLBACK_OWNER_PUBLIC_KEY_PROD: stub-rollback-key

jobs:
  bicep-build:
    name: Build every Bicep entry point and module
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show az/bicep versions
        run: |
          az version
          az bicep version

      - name: Build every Bicep entry point
        run: |
          set -euo pipefail
          for f in infra/*.bicep; do
            echo "::group::az bicep build --file ${f}"
            az bicep build --file "${f}"
            echo "::endgroup::"
          done

      - name: Build every Bicep module
        run: |
          set -euo pipefail
          for f in infra/modules/*.bicep; do
            echo "::group::az bicep build --file ${f}"
            az bicep build --file "${f}"
            echo "::endgroup::"
          done

  bicepparam-build:
    name: Build every .bicepparam file
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build every .bicepparam file
        run: |
          set -euo pipefail
          for f in infra/params/*.bicepparam; do
            echo "::group::az bicep build-params --file ${f}"
            az bicep build-params --file "${f}"
            echo "::endgroup::"
          done

  helper-script-self-tests:
    name: Run .github/scripts/azure helper script self-tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    # No Azure login, no OIDC, no real credentials -- every assertion here
    # is either a pure-bash/pure-Node fixture check or a fail-closed
    # argument-validation check that never reaches a live `git`/`gh`/`az`
    # call, consistent with this workflow's no-live-secrets design.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test lib/common.sh validators
        run: .github/scripts/azure/tests/test-common-sh.sh

      - name: Self-test reject-unsafe-whatif-deletes.mjs against fixtures
        run: node .github/scripts/azure/tests/test-reject-unsafe-whatif-deletes.mjs

      - name: Self-test validate-report.mjs digest/SHA/pass binding against fixtures
        run: node .github/scripts/azure/tests/test-validate-report.mjs

      - name: Self-test verify-deploy-sha.sh argument validation (no live network calls)
        run: .github/scripts/azure/tests/test-verify-deploy-sha.sh

      - name: Self-test exact model quota validation
        run: .github/scripts/azure/tests/test-validate-model-quota.sh

      - name: Self-test full-template operations job start
        run: .github/scripts/azure/tests/test-run-ops-job.sh
