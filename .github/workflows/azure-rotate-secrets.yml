name: Azure rotate secrets

# Manual, protected Key Vault secret rotation for prod. Disables the
# scheduler jobs first, redeploys release.bicep with the SAME exact
# current image digests (no new build, no release change) so that only
# the Key Vault secret values actually rotate, reruns target-smoke to
# prove the rotated secrets still work, publishes evidence, and leaves
# prod exactly where it started: disabled/Manual. This workflow never
# passes a `--set-string-param` override for rolloutMode or either
# trigger type anywhere, so it can never re-enable a schedule as a side
# effect (ADR 0008 items 11-12).
#
# Like azure-deploy-prod.yml, the rollout.bicep "disable schedules" step
# runs under the `production-promotion` Environment/identity (never
# `production-deploy`) -- infra/README.md documents this identity split as
# a process control ("prod deploy ... never rollout.bicep" / "prod
# promotion ... rollout.bicep for prod only"), so this workflow pauses for
# TWO separate GitHub Environment approval gates in sequence even though
# the task names only `production-deploy` as its overall protected gate.
#
# The actual NEW secret values are never an input to this workflow: the
# operator rotates each secret's value in the `production-deploy`
# Environment's GitHub secrets *before* running this workflow, and the
# release.bicep redeploy here picks up whatever value is currently stored
# there (identical mechanism to every other release.bicep deploy in this
# repo -- readEnvironmentVariable() inside the committed bicepparam file).
# This workflow only ever reads those secrets to pass them through to
# `az deployment group create`; it never echoes or logs a secret value.
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Exact 40-hex commit SHA you expect to still be the currently-deployed prod release (safety cross-check -- fails closed on a mismatch)."
        required: true
        type: string

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_RESOURCE_GROUP_NAME: ${{ vars.PROD_RESOURCE_GROUP_NAME }}
  OPS_JOB_TIMEOUT_SECONDS: "1800"
  # Fixed, deterministic names matching infra/environment.bicep and
  # infra/params/{environment,release,rollout}.prod.bicepparam exactly (not
  # re-derived) -- if those committed files ever change these names, these
  # must be updated to match.
  ACR_NAME: acrkryptoprod
  CONTAINER_APPS_ENVIRONMENT_NAME: cae-krypto-prod
  RUNTIME_IDENTITY_NAME: id-krypto-prod-runtime
  SCHEDULER_IDENTITY_NAME: id-krypto-prod-scheduler
  OPS_IDENTITY_NAME: id-krypto-prod-ops
  WEB_APP_NAME: ca-prod-web
  PREFLIGHT_JOB_NAME: caj-prod-preflight
  VERIFIED_BACKUP_JOB_NAME: caj-prod-verified-backup
  TARGET_SMOKE_JOB_NAME: caj-prod-target-smoke
  MIGRATE_INIT_JOB_NAME: caj-prod-migrate-init
  PROD_HOURLY_JOB_NAME: caj-prod-agent-run
  PROD_DAILY_JOB_NAME: caj-prod-daily-summary
  EVIDENCE_STORAGE_ACCOUNT_NAME: stkryptoprodevid
  COMMUNICATION_SERVICE_NAME: acs-krypto-prod

jobs:
  gate:
    name: Validate the expected release SHA input
    runs-on: ubuntu-latest
    env:
      INPUT_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
    outputs:
      expected_sha: ${{ steps.validate.outputs.expected_sha }}
    steps:
      - name: Checkout (for lib/common.sh only)
        uses: actions/checkout@v4

      - name: Validate expected_release_sha
        id: validate
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          expected_sha="$(azure_validate_release_sha "${INPUT_EXPECTED_RELEASE_SHA}")"
          echo "expected_sha=${expected_sha}" >> "$GITHUB_OUTPUT"

  disable-schedules:
    name: Disable schedules (rollout.bicep, forced disabled/Manual)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-promotion
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ needs.gate.outputs.expected_sha }}
    outputs:
      current_sha: ${{ steps.current.outputs.sha }}
      current_web_digest: ${{ steps.current.outputs.web_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify live production-promotion approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-promotion

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the currently-deployed release SHA and web image digest
        id: current
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh

          current_sha="$(az containerapp job show \
            --name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='RELEASE_SHA'].value | [0]" \
            --output tsv)"
          current_sha="$(azure_validate_release_sha "${current_sha}")"
          if [ "${current_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Currently-deployed release SHA '${current_sha}' does not match expected_release_sha '${EXPECTED_SHA}' -- refusing to rotate secrets against an unexpected release." >&2
            exit 1
          fi
          echo "sha=${current_sha}" >> "$GITHUB_OUTPUT"

          web_image="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].image" \
            --output tsv)"
          case "${web_image}" in
            *@sha256:*)
              web_digest_hex="${web_image##*@sha256:}"
              ;;
            *)
              echo "Currently-deployed web image '${web_image}' is not pinned to an immutable sha256 digest." >&2
              exit 1
              ;;
          esac
          web_digest="$(azure_validate_image_digest "sha256:${web_digest_hex}")"
          echo "web_digest=${web_digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Resolve live resource IDs required by rollout.bicep
        id: resolve
        run: |
          set -euo pipefail
          cae_id="$(az containerapp env show \
            --name "${CONTAINER_APPS_ENVIRONMENT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          acr_login_server="$(az acr show \
            --name "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query loginServer --output tsv)"
          runtime_identity_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          runtime_identity_client_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query clientId --output tsv)"
          scheduler_identity_id="$(az identity show \
            --name "${SCHEDULER_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          communication_email_sender="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='AZURE_COMMUNICATION_EMAIL_SENDER'].value | [0]" \
            --output tsv)"
          for pair in "cae_id=${cae_id}" "acr_login_server=${acr_login_server}" "runtime_identity_id=${runtime_identity_id}" "runtime_identity_client_id=${runtime_identity_client_id}" "scheduler_identity_id=${scheduler_identity_id}" "communication_email_sender=${communication_email_sender}"; do
            if [ -z "${pair#*=}" ]; then
              echo "Failed to resolve one of the required live resource IDs (${pair%%=*} was empty)." >&2
              exit 1
            fi
          done
          {
            echo "cae_id=${cae_id}"
            echo "acr_login_server=${acr_login_server}"
            echo "runtime_identity_id=${runtime_identity_id}"
            echo "runtime_identity_client_id=${runtime_identity_client_id}"
            echo "scheduler_identity_id=${scheduler_identity_id}"
            echo "communication_email_sender=${communication_email_sender}"
          } >> "$GITHUB_OUTPUT"

      - name: Render rollout.prod.bicepparam (force disabled/Manual, no promotion override)
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/rollout.prod.bicepparam \
            --out /tmp/rollout.prod.force-disabled.bicepparam \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${{ steps.resolve.outputs.cae_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${{ steps.resolve.outputs.acr_login_server }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${{ steps.resolve.outputs.runtime_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityClientId="${{ steps.resolve.outputs.runtime_identity_client_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${{ steps.resolve.outputs.scheduler_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationEmailSender="${{ steps.resolve.outputs.communication_email_sender }}" \
            --set REPLACE_WITH_CURRENTLY_RELEASED_DIGEST="${{ steps.current.outputs.web_digest }}" \
            --set REPLACE_WITH_REAL_COMMIT_SHA000000000000="${{ steps.current.outputs.sha }}"
          # The committed file defaults rolloutMode to disabled and both
          # trigger types to Manual, so this can never promote.

      - name: What-if infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.force-disabled.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-rollout.json

      - name: Reject unsafe what-if deletes
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-rollout.json

      - name: Deploy infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "roll-prod-rotate-disable-${{ github.run_id }}-${{ github.run_attempt }}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.force-disabled.bicepparam \
            --query properties.outputs \
            --output json > /tmp/rollout-outputs.json
          cat /tmp/rollout-outputs.json

      - name: Confirm schedules are disabled/Manual
        run: |
          set -euo pipefail
          rollout_mode="$(jq -r '.rolloutMode.value // empty' /tmp/rollout-outputs.json)"
          hourly_trigger_type="$(jq -r '.hourlyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          daily_trigger_type="$(jq -r '.dailyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          if [ "${rollout_mode}" != "disabled" ] || [ "${hourly_trigger_type}" != "Manual" ] || [ "${daily_trigger_type}" != "Manual" ]; then
            echo "Expected rolloutMode=disabled, hourlyTriggerType=Manual, dailyTriggerType=Manual, but got rolloutMode='${rollout_mode}' hourly='${hourly_trigger_type}' daily='${daily_trigger_type}' -- failing closed." >&2
            exit 1
          fi
          for job_name in "${PROD_HOURLY_JOB_NAME}" "${PROD_DAILY_JOB_NAME}"; do
            az containerapp job show \
              --name "${job_name}" \
              --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
              --output json |
              jq -e '(.properties.configuration.triggerType == "Manual") and
                     ((.properties.configuration.scheduleTriggerConfig // null) == null)' >/dev/null
          done
          echo "Confirmed: schedules are disabled/Manual."

      - name: Disable missing-success monitoring after schedules are Manual
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "monitor-prod-rotate-disable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/schedule-monitoring.bicep \
            --parameters infra/params/schedule-monitoring.prod.bicepparam \
            --query properties.outputs \
            --output json > /tmp/monitoring-rotate-disabled-outputs.json
          enabled="$(jq -r '.missingHourlySuccessAlertEnabled.value | tostring' /tmp/monitoring-rotate-disabled-outputs.json)"
          boundary="$(jq -r '.scheduleEnabledAtUnixSeconds.value // empty' /tmp/monitoring-rotate-disabled-outputs.json)"
          if [ "${enabled}" != "false" ] || [ "${boundary}" != "0" ]; then
            echo "Secret rotation could not disable missing-success monitoring after jobs became Manual." >&2
            exit 1
          fi

  preflight-backup-current:
    name: Preflight and verified backup before secret mutation
    needs: [gate, disable-schedules]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CURRENT_SHA: ${{ needs.disable-schedules.outputs.current_sha }}
    steps:
      - name: Checkout approval verifier
        uses: actions/checkout@v4

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Checkout current release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.disable-schedules.outputs.current_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve evidence container URL
        id: evidence
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          blob_endpoint="$(az storage account show \
            --name "${EVIDENCE_STORAGE_ACCOUNT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query primaryEndpoints.blob \
            --output tsv)"
          container_url="$(azure_validate_container_url "${blob_endpoint%/}/evidence")"
          echo "container_url=${container_url}" >> "$GITHUB_OUTPUT"

      - name: Run current-release preflight
        env:
          EVIDENCE_CONTAINER_URL: ${{ steps.evidence.outputs.container_url }}
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id preflight)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation preflight \
            --job-execution-id "${job_execution_id}" \
            --destination evidence-current
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence-current/prod/${CURRENT_SHA}/preflight/${job_execution_id}/report.json" \
            --operation preflight \
            --release-sha "${CURRENT_SHA}"

      - name: Run current-release verified backup
        env:
          EVIDENCE_CONTAINER_URL: ${{ steps.evidence.outputs.container_url }}
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id verified-backup)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${VERIFIED_BACKUP_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation verified-backup \
            --job-execution-id "${job_execution_id}" \
            --destination evidence-current
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence-current/prod/${CURRENT_SHA}/verified-backup/${job_execution_id}/report.json" \
            --operation verified-backup \
            --release-sha "${CURRENT_SHA}"

      - name: Publish pre-rotation safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-rotate-secrets-current-evidence-${{ needs.disable-schedules.outputs.current_sha }}
          path: evidence-current/
          if-no-files-found: warn
          retention-days: 90

  rotate-release-secrets:
    name: Redeploy release.bicep with the same image digests and rotated Key Vault secrets
    needs: [gate, disable-schedules, preflight-backup-current]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CURRENT_SHA: ${{ needs.disable-schedules.outputs.current_sha }}
      CURRENT_WEB_DIGEST: ${{ needs.disable-schedules.outputs.current_web_digest }}
    outputs:
      evidence_container_url: ${{ steps.evidence.outputs.container_url }}
    steps:
      - name: Checkout approval verifier
        uses: actions/checkout@v4

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Checkout ${{ needs.disable-schedules.outputs.current_sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.disable-schedules.outputs.current_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the current ops image digest
        id: ops_digest
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          ops_image="$(az containerapp job show \
            --name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].image" \
            --output tsv)"
          case "${ops_image}" in
            *@sha256:*)
              ops_digest_hex="${ops_image##*@sha256:}"
              ;;
            *)
              echo "Currently-deployed ops image '${ops_image}' is not pinned to an immutable sha256 digest." >&2
              exit 1
              ;;
          esac
          ops_digest="$(azure_validate_image_digest "sha256:${ops_digest_hex}")"
          echo "digest=${ops_digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Resolve live resource IDs and evidence container URL required by release.bicep
        id: resolve
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          cae_id="$(az containerapp env show \
            --name "${CONTAINER_APPS_ENVIRONMENT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          acr_login_server="$(az acr show \
            --name "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query loginServer --output tsv)"
          runtime_identity_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          runtime_identity_principal_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query principalId --output tsv)"
          runtime_identity_client_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query clientId --output tsv)"
          scheduler_identity_id="$(az identity show \
            --name "${SCHEDULER_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          scheduler_identity_principal_id="$(az identity show \
            --name "${SCHEDULER_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query principalId --output tsv)"
          ops_identity_id="$(az identity show \
            --name "${OPS_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          ops_identity_principal_id="$(az identity show \
            --name "${OPS_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query principalId --output tsv)"
          ops_identity_client_id="$(az identity show \
            --name "${OPS_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query clientId --output tsv)"
          blob_endpoint="$(az storage account show \
            --name "${EVIDENCE_STORAGE_ACCOUNT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query primaryEndpoints.blob \
            --output tsv)"
          communication_email_sender="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='AZURE_COMMUNICATION_EMAIL_SENDER'].value | [0]" \
            --output tsv)"
          for pair in \
            "cae_id=${cae_id}" \
            "acr_login_server=${acr_login_server}" \
            "runtime_identity_id=${runtime_identity_id}" \
            "runtime_identity_principal_id=${runtime_identity_principal_id}" \
            "runtime_identity_client_id=${runtime_identity_client_id}" \
            "scheduler_identity_id=${scheduler_identity_id}" \
            "scheduler_identity_principal_id=${scheduler_identity_principal_id}" \
            "ops_identity_id=${ops_identity_id}" \
            "ops_identity_principal_id=${ops_identity_principal_id}" \
            "ops_identity_client_id=${ops_identity_client_id}" \
            "blob_endpoint=${blob_endpoint}" \
            "communication_email_sender=${communication_email_sender}"; do
            if [ -z "${pair#*=}" ]; then
              echo "Failed to resolve one of the required live values (${pair%%=*} was empty)." >&2
              exit 1
            fi
          done
          evidence_container_url="$(azure_validate_container_url "${blob_endpoint%/}/evidence")"
          {
            echo "cae_id=${cae_id}"
            echo "acr_login_server=${acr_login_server}"
            echo "runtime_identity_id=${runtime_identity_id}"
            echo "runtime_identity_principal_id=${runtime_identity_principal_id}"
            echo "runtime_identity_client_id=${runtime_identity_client_id}"
            echo "scheduler_identity_id=${scheduler_identity_id}"
            echo "scheduler_identity_principal_id=${scheduler_identity_principal_id}"
            echo "ops_identity_id=${ops_identity_id}"
            echo "ops_identity_principal_id=${ops_identity_principal_id}"
            echo "ops_identity_client_id=${ops_identity_client_id}"
            echo "communication_email_sender=${communication_email_sender}"
            echo "evidence_container_url=${evidence_container_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Render release.prod.bicepparam (same image digests, rotated secrets read live)
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/release.prod.bicepparam \
            --out /tmp/release.prod.resolved.bicepparam \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${{ steps.resolve.outputs.cae_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${{ steps.resolve.outputs.acr_login_server }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${{ steps.resolve.outputs.runtime_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityClientId="${{ steps.resolve.outputs.runtime_identity_client_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityPrincipalId="${{ steps.resolve.outputs.runtime_identity_principal_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${{ steps.resolve.outputs.scheduler_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityPrincipalId="${{ steps.resolve.outputs.scheduler_identity_principal_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityId="${{ steps.resolve.outputs.ops_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityPrincipalId="${{ steps.resolve.outputs.ops_identity_principal_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityClientId="${{ steps.resolve.outputs.ops_identity_client_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_evidenceContainerUrl="${{ steps.resolve.outputs.evidence_container_url }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationServiceName="${COMMUNICATION_SERVICE_NAME}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationEmailSender="${{ steps.resolve.outputs.communication_email_sender }}" \
            --set REPLACE_WITH_PUSHED_WEB_DIGEST="${CURRENT_WEB_DIGEST}" \
            --set REPLACE_WITH_PUSHED_OPS_DIGEST="${{ steps.ops_digest.outputs.digest }}" \
            --set REPLACE_WITH_REAL_COMMIT_SHA000000000000="${CURRENT_SHA}"

      - name: What-if infra/release.bicep
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_PROD: ${{ secrets.DIRECT_URL }}
          MIGRATION_URL_PROD: ${{ secrets.MIGRATION_URL }}
          CRON_SECRET_PROD: ${{ secrets.CRON_SECRET }}
          POSTHOG_API_KEY_PROD: ${{ secrets.POSTHOG_API_KEY }}
          ADMIN_PASSWORD_PROD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET_PROD: ${{ secrets.ADMIN_SESSION_SECRET }}
          RUNTIME_DATABASE_PASSWORD_PROD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          MIGRATOR_DATABASE_PASSWORD_PROD: ${{ secrets.MIGRATOR_DATABASE_PASSWORD }}
          DEPLOYMENT_APPROVAL_SECRET_PROD: ${{ secrets.DEPLOYMENT_APPROVAL_SECRET }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/release.bicep \
            --parameters /tmp/release.prod.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-release.json

      - name: Reject unsafe what-if deletes
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-release.json

      - name: Deploy infra/release.bicep (same digests, rotated Key Vault secret values)
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_PROD: ${{ secrets.DIRECT_URL }}
          MIGRATION_URL_PROD: ${{ secrets.MIGRATION_URL }}
          CRON_SECRET_PROD: ${{ secrets.CRON_SECRET }}
          POSTHOG_API_KEY_PROD: ${{ secrets.POSTHOG_API_KEY }}
          ADMIN_PASSWORD_PROD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET_PROD: ${{ secrets.ADMIN_SESSION_SECRET }}
          RUNTIME_DATABASE_PASSWORD_PROD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          MIGRATOR_DATABASE_PASSWORD_PROD: ${{ secrets.MIGRATOR_DATABASE_PASSWORD }}
          DEPLOYMENT_APPROVAL_SECRET_PROD: ${{ secrets.DEPLOYMENT_APPROVAL_SECRET }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "rel-prod-rotate-${{ github.run_id }}-${{ github.run_attempt }}" \
            --template-file infra/release.bicep \
            --parameters /tmp/release.prod.resolved.bicepparam

      - name: Resolve the evidence container URL for the target-smoke step
        id: evidence
        run: |
          set -euo pipefail
          echo "container_url=${{ steps.resolve.outputs.evidence_container_url }}" >> "$GITHUB_OUTPUT"

  target-smoke-and-publish:
    name: Apply database credential rotation, rerun target-smoke, and publish evidence
    needs: [gate, disable-schedules, rotate-release-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CURRENT_SHA: ${{ needs.disable-schedules.outputs.current_sha }}
      CURRENT_WEB_DIGEST: ${{ needs.disable-schedules.outputs.current_web_digest }}
      EVIDENCE_CONTAINER_URL: ${{ needs.rotate-release-secrets.outputs.evidence_container_url }}
    steps:
      - name: Checkout approval verifier
        uses: actions/checkout@v4

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Checkout ${{ needs.disable-schedules.outputs.current_sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.disable-schedules.outputs.current_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply migrator and runtime database credential rotation
        id: migrate_init
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id migrate-init)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${MIGRATE_INIT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation migrate-init \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${CURRENT_SHA}/migrate-init/${job_execution_id}/report.json" \
            --operation migrate-init \
            --release-sha "${CURRENT_SHA}"
          echo "job_execution_id=${job_execution_id}" >> "$GITHUB_OUTPUT"

      - name: Run target-smoke
        id: target_smoke
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id target-smoke)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${TARGET_SMOKE_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation target-smoke \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${CURRENT_SHA}/target-smoke/${job_execution_id}/report.json" \
            --operation target-smoke \
            --release-sha "${CURRENT_SHA}" \
            --image-digest "sha256:${CURRENT_WEB_DIGEST}"
          echo "job_execution_id=${job_execution_id}" >> "$GITHUB_OUTPUT"

      - name: Surface retained target-smoke evidence
        env:
          MIGRATE_INIT_EXECUTION_ID: ${{ steps.migrate_init.outputs.job_execution_id }}
          TARGET_SMOKE_EXECUTION_ID: ${{ steps.target_smoke.outputs.job_execution_id }}
        run: |
          set -euo pipefail
          {
            echo "### target-smoke evidence after secret rotation"
            echo ""
            echo "- release SHA: \`${CURRENT_SHA}\`"
            echo "- image digest: \`sha256:${CURRENT_WEB_DIGEST}\`"
            echo "- migrate_init_execution_id: \`${MIGRATE_INIT_EXECUTION_ID}\`"
            echo "- target_smoke_execution_id: \`${TARGET_SMOKE_EXECUTION_ID}\`"
            echo ""
            echo "No production promotion workflow is shipped or approved. Preserve this exact evidence ID for any future independently reviewed promotion design."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish downloaded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-rotate-secrets-evidence-${{ needs.disable-schedules.outputs.current_sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Confirm prod is still disabled/Manual after rotation
        run: |
          set -euo pipefail
          rollout_mode="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='ROLLOUT_MODE'].value | [0]" \
            --output tsv)"
          if [ "${rollout_mode}" != "disabled" ]; then
            echo "Expected ROLLOUT_MODE=disabled after secret rotation, but found '${rollout_mode}' -- this workflow must never leave prod in any other mode." >&2
            exit 1
          fi
          echo "Secret rotation complete for release ${CURRENT_SHA}. Prod remains disabled/Manual -- this workflow never re-enables a schedule as a side effect."
