name: Agentic Factory Full E2E

on:
  workflow_dispatch:
    inputs:
      goal_issue:
        description: Standing autonomous goal issue number (omit to discover it)
        required: false
        type: string
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: agentic-factory-full-e2e
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  deployments: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  full-cycle:
    name: Exercise issue through exact-SHA paper-production evidence
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_GOAL_ISSUE: ${{ inputs.goal_issue }}
    steps:
      - name: Check out trusted factory policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/agentic-policy.json
      - name: Create authorized canary issue
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { AUTONOMOUS_GOAL_LABEL, isAutonomousGoal } = require(
              require("node:path").join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-autonomy.cjs"),
            );
            const goals = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: AUTONOMOUS_GOAL_LABEL, per_page: 100,
            })).filter((issue) => !issue.pull_request);
            if (goals.length !== 1 || !isAutonomousGoal(goals[0])) {
              throw new Error("A unique standing repository-authorized goal is required.");
            }
            const rawGoal = process.env.INPUT_GOAL_ISSUE || String(goals[0].number);
            if (!/^[1-9]\d*$/.test(rawGoal || "")) {
              throw new Error("A positive approved goal issue number is required.");
            }
            const goalNumber = Number(rawGoal);
            if (goalNumber !== goals[0].number) {
              throw new Error("Canary target does not match the standing mission.");
            }

            const [{ data: goal }, controls] = await Promise.all([
              github.rest.issues.get({
                owner,
                repo,
                issue_number: goalNumber,
              }),
              github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                labels: "factory-control",
                per_page: 100,
              }),
            ]);
            const goalLabels = new Set(
              goal.labels.map((label) =>
                typeof label === "string" ? label : label.name,
              ),
            );
            if (
              goal.state !== "open" ||
              !goalLabels.has("factory:goal") ||
              !goalLabels.has("factory:goal-approved") ||
              !goal.milestone
            ) {
              throw new Error(
                `Goal #${goalNumber} is not an open, approved, milestone-bound factory goal.`,
              );
            }
            if (controls.length !== 1) {
              throw new Error(
                `Expected one factory-control issue; found ${controls.length}.`,
              );
            }
            const controlLabels = new Set(
              controls[0].labels.map((label) =>
                typeof label === "string" ? label : label.name,
              ),
            );
            const modes = ["factory-mode:active", "factory-mode:paused", "factory-mode:shadow"];
            if (!controlLabels.has("factory-mode:active") ||
                modes.filter((mode) => controlLabels.has(mode)).length !== 1 ||
                !isAutonomousGoal(goal)) {
              throw new Error("Canary requires unambiguous active mode and the unchanged standing mission.");
            }
            const { resolveFactoryMode } = require(
              require("node:path").join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-lifecycle-reconciler.cjs"),
            );
            if (await resolveFactoryMode({ github, core, owner, repo }) !== "active") {
              throw new Error("Canary requires the human-attested active factory.");
            }

            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const requestedAt = new Date().toISOString();
            const body = [
              "### Work type",
              "",
              "implementation",
              "",
              "### Approved parent goal",
              "",
              `#${goalNumber}`,
              "",
              "### Problem or goal",
              "",
              "Refresh the stable autonomous factory heartbeat with this canary run.",
              "",
              "### Scope and non-goals",
              "",
              "Modify only `docs/e2e/factory-full-heartbeat.md`. Do not change application, trading, auth, database, deployment, workflow, agent, skill, policy, or production files.",
              "",
              "### Allowed paths",
              "",
              "docs/e2e/factory-full-heartbeat.md",
              "",
              "### Risk tier",
              "",
              "risk:routine",
              "",
              "### Dependencies",
              "",
              "None",
              "",
              "### Acceptance criteria",
              "",
              `- The heartbeat names [run ${process.env.GITHUB_RUN_ID}](${runUrl}).`,
              `- The heartbeat records requested time \`${requestedAt}\`.`,
              "- Exactly one owned PR is merged; closure requires same-SHA native development and paper-production receipts, including an actual scheduled PAPER run.",
              "",
              "### Validation plan",
              "",
              "Verify the single Markdown file contains the exact run link and requested timestamp.",
              "",
              "### Rollback or safe reversal",
              "",
              "Revert the single heartbeat commit.",
              "",
              "### Context, links, or constraints",
              "",
              `Full-cycle canary run: ${runUrl}`,
            ].join("\n");

            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title: `[factory-canary] Full autonomous cycle ${process.env.GITHUB_RUN_ID}`,
              body,
              labels: [
                "agentic-factory",
                "ready-for-ai-dev",
                "risk:routine",
              ],
              milestone: goal.milestone.number,
            });

            try {
              await github.request(
                "POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
                {
                  owner,
                  repo,
                  issue_number: goalNumber,
                  sub_issue_id: issue.id,
                },
              );
            } catch (error) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "not_planned",
              });
              throw error;
            }

            core.setOutput("issue", String(issue.number));
            core.setOutput("goal", String(goalNumber));
            core.setOutput("requested_at", requestedAt);

      - name: Invoke queue controller
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "factory-queue-controller.yml",
              ref: context.payload.repository.default_branch,
            });

      - name: Wait for verified terminal paper-production state
        uses: actions/github-script@v9
        env:
          CANARY_ISSUE: ${{ steps.create.outputs.issue }}
          REQUESTED_AT: ${{ steps.create.outputs.requested_at }}
          FACTORY_ASSIGNMENT_ACTOR_NODE_ID: ${{ vars.FACTORY_ASSIGNMENT_ACTOR_NODE_ID }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = require("node:path");
            const reconciler = require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-lifecycle-reconciler.cjs"));
            const { LIFECYCLE_STATES } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-factory-policy.cjs"),
            );
            const { inspectProductionDelivery } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/azure/production-evidence.cjs"),
            );
            const { resolveRepositoryCopilotIdentity, normalizeConfiguredUserNodeId } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-identity.cjs"),
            );
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const copilotIdentity = await resolveRepositoryCopilotIdentity({
              github, owner, repo, verifyPinnedIdentity: true,
            });
            const assignmentActorNodeId = normalizeConfiguredUserNodeId(process.env.FACTORY_ASSIGNMENT_ACTOR_NODE_ID);
            const issueNumber = Number(process.env.CANARY_ISSUE);
            const lifecycle = new Set(Object.values(LIFECYCLE_STATES));
            const readCompletionProvenance = async (issue) => {
              const labels = reconciler.labelNames(issue).sort();
              if (issue.number !== issueNumber || issue.state !== "closed" || issue.state_reason !== "completed" ||
                  labels.filter((label) => lifecycle.has(label)).join() !== LIFECYCLE_STATES.DONE) {
                throw new Error("Canary terminal state is not an unambiguous completed issue.");
              }
              const [comments, pulls] = await Promise.all([
                github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 }),
                github.paginate(github.rest.pulls.list, { owner, repo, state: "all", per_page: 100 }),
              ]);
              const now = new Date().toISOString();
              const claim = reconciler.resolveLatestIssueClaim(comments, issueNumber, now);
              if (claim.state !== "valid") throw new Error("Canary lost its authoritative claim.");
              const correlation = reconciler.correlatePullRequests({
                pullRequests: pulls, issueNumber, nonce: claim.claim.nonce,
                repository: `${owner}/${repo}`, defaultBranch: repository.default_branch, copilotIdentity,
              });
              if (correlation.candidates.length !== 1 || correlation.valid.length !== 1 ||
                  correlation.malformed.length !== 0) {
                throw new Error("Canary does not have exactly one claim-owned pull request.");
              }
              const pull = correlation.valid[0];
              if (pull.state !== "closed" || !Number.isFinite(Date.parse(pull.merged_at)) ||
                  !/^[0-9a-f]{40}$/.test(pull.merge_commit_sha || "")) {
                throw new Error(`Canary PR #${pull.number} did not produce an exact merge SHA.`);
              }
              const assignment = await reconciler.verifyPersistedAssignmentProvenance({
                github, owner, repo, issue, comments, claim: claim.claim, now,
                copilotIdentity, assignmentActorNodeId,
              });
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pull.number, per_page: 100,
              });
              if (!assignment.valid || files.length !== 1 ||
                  files[0].filename !== "docs/e2e/factory-full-heartbeat.md" || files[0].previous_filename) {
                throw new Error("Canary assignment or exact single-file scope is not valid.");
              }
              return {
                pull,
                fingerprint: JSON.stringify([
                  issue.number, issue.state, issue.state_reason, issue.body, labels, claim.claim,
                  pull.number, pull.title, pull.body, pull.state, pull.draft,
                  pull.head?.sha, pull.merged_at, pull.merge_commit_sha, files,
                ]),
              };
            };
            const deadline = Date.now() + 330 * 60 * 1000;
            let previous = "";

            while (Date.now() < deadline) {
              if (await reconciler.resolveFactoryMode({ github, core, owner, repo }) !== "active") {
                throw new Error("Factory stopped before the full canary completed.");
              }
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              const labels = issue.labels
                .map((label) =>
                  typeof label === "string" ? label : label.name,
                )
                .filter(Boolean)
                .sort();
              const summary = JSON.stringify({
                state: issue.state,
                labels,
              });
              if (summary !== previous) {
                core.info(summary);
                previous = summary;
              }

              if (labels.includes("blocked")) {
                throw new Error(`Canary issue #${issueNumber} entered blocked state.`);
              }
              if (
                issue.state === "closed" &&
                labels.includes("factory:done")
              ) {
                const provenance = await readCompletionProvenance(issue);
                const { pull } = provenance;
                const { data: heartbeat } =
                  await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: "docs/e2e/factory-full-heartbeat.md",
                    ref: pull.merge_commit_sha,
                  });
                if (
                  Array.isArray(heartbeat) ||
                  heartbeat.type !== "file"
                ) {
                  throw new Error(
                    "Full-cycle heartbeat path did not resolve to a file.",
                  );
                }
                const heartbeatContent = Buffer.from(
                  heartbeat.content,
                  "base64",
                ).toString("utf8");
                if (
                  !heartbeatContent.includes(
                    `[run ${process.env.GITHUB_RUN_ID}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
                  ) ||
                  !heartbeatContent.includes(process.env.REQUESTED_AT)
                ) {
                  throw new Error(
                    "Full-cycle heartbeat does not contain this run's exact evidence.",
                  );
                }
                const delivery = await inspectProductionDelivery({
                  github, owner, repo, repositoryId: repository.id, releaseSha: pull.merge_commit_sha,
                });
                if (delivery.state !== "success" ||
                    Date.parse(delivery.receipt.release.generatedAt) < Date.parse(pull.merged_at)) {
                  throw new Error(`Merge ${pull.merge_commit_sha} lacks native paper-production delivery (${delivery.reason}).`);
                }
                const { data: finalIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if ((await readCompletionProvenance(finalIssue)).fingerprint !== provenance.fingerprint) {
                  throw new Error("Canary completion provenance changed during native production verification.");
                }
                if (await reconciler.resolveFactoryMode({ github, core, owner, repo }) !== "active") {
                  throw new Error("Factory stopped during final canary verification.");
                }
                core.info(
                  `Canary issue #${issueNumber} completed through exact-SHA development and scheduled paper-production evidence.`,
                );
                return;
              }
              if (issue.state === "closed") {
                throw new Error(
                  `Canary issue #${issueNumber} closed without factory completion evidence.`,
                );
              }

              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            throw new Error(
              `Timed out waiting for canary issue #${issueNumber} to complete.`,
            );
