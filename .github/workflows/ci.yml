name: CI
run-name: ${{ inputs.correlation_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact pull request head to validate
        required: false
        type: string
      correlation_id:
        description: Reconciler run correlation
        required: false
        type: string
  push:
    branches:
      - main
      - develop
      - 'develop/**'
  pull_request:
    branches:
      - main
      - develop
      - 'develop/**'

# Newer pushes to the same branch cancel in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and evidence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Verify dispatched head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha != '' }}
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck scripts and tests
        # `next build` only typechecks the app code (scripts/ and tests/ are
        # excluded from tsconfig.json). Run a separate pass over them via
        # tsconfig.scripts.json to catch type errors in seed scripts and tests.
        run: npm run typecheck:scripts

      - name: Typecheck (Next.js build)
        # `next build` runs the TypeScript compiler over the app code.
        # Stub env vars so config/Zod schemas resolve without real secrets;
        # build does not call validateEnv() at runtime.
        env:
          AZURE_OPENAI_BASE_URL: https://stub.openai.azure.com/openai/v1/
          AZURE_OPENAI_DEPLOYMENT_NAME: krypto-test-luna
          AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          AZURE_COMMUNICATION_CONNECTION_STRING: endpoint=https://stub.communication.azure.com/;accesskey=stub
          AZURE_COMMUNICATION_EMAIL_SENDER: DoNotReply@stub.azurecomm.net
          ALERT_EMAIL_TO: operator@example.com
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          POSTHOG_API_KEY: phc_stub
          DATABASE_POOL_MAX: "2"
          POSTHOG_ENVIRONMENT: dev
          CRON_SECRET: stub
          APP_ORIGIN: https://stub.example.com
          ADMIN_PASSWORD: stub
          ADMIN_SESSION_SECRET: stub
        run: npm run build

      - name: Test agentic SDLC automation
        run: npm run test:agentic-sdlc

      - name: Test critical coverage
        run: npm run test:coverage

      - name: Run all engineering backtests
        run: npm run backtest:all -- --out artifacts/backtest-all.json

      - name: Upload backtest evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-backtest-report
          path: artifacts/backtest-all.json
          if-no-files-found: error

      - name: Generate evidence fixture artifacts
        run: |
          mkdir -p artifacts/evidence
          npm run --silent evidence:import -- \
            --input tests/fixtures/evidence/eth-daily.json \
            --out artifacts/evidence/dataset.json
          jq --arg sha "$GITHUB_SHA" \
            '.implementationCommitSha = $sha' \
            tests/fixtures/evidence/eth-daily-plan.json \
            > artifacts/evidence/plan.json
          npm run --silent evidence:evaluate -- \
            --dataset artifacts/evidence/dataset.json \
            --plan artifacts/evidence/plan.json \
            --json-out artifacts/evidence/report.json \
            --html-out artifacts/evidence/report.html

      - name: Upload evidence fixture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-evidence-fixture-${{ github.sha }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  postgres:
    name: PostgreSQL migrations and execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Verify dispatched migration head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha != '' }}
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run migration and transactional integration suite
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:integration

      - name: Reject schema and migration drift
        env:
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"

  publish-dispatched-evidence:
    name: Publish dispatched head evidence
    needs: [quality, postgres]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.head_sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Bind CI results to the validated PR head
        uses: actions/github-script@v9
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        with:
          script: |
            const sha = process.env.EXPECTED_HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || "")) {
              throw new Error("Expected an exact validated commit SHA.");
            }
            const checks = [];
            for (const [name, result] of [
              ["Quality and evidence gates", process.env.QUALITY_RESULT],
              ["PostgreSQL migrations and execution", process.env.POSTGRES_RESULT],
            ]) {
              const { data: published } = await github.rest.checks.create({
                ...context.repo, name, head_sha: sha, status: "completed",
                conclusion: result === "success" ? "success" : "failure",
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                output: { title: `${name}: ${result}`, summary: `Trusted CI dispatch validated commit ${sha}. Job result: ${result}.` },
              });
              checks.push({ id: published.id, name, conclusion: published.conclusion });
            }
            require("node:fs").writeFileSync(require("node:path").join(process.env.RUNNER_TEMP, "receipt.json"), JSON.stringify({
              schemaVersion: 1, runId: context.runId,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), headSha: sha, checks,
            }));
      - name: Preserve trusted CI receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-receipt-${{ inputs.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7

  harness-integrity:
    name: Harness integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only, no secrets: validates the agentic harness (policy, generated
    # docs, references, instruction budget) and proves GH-AW sources are
    # compiled and free of lock / command-router drift.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gh-aw CLI
        # Pinned to the same version as copilot-setup-steps.yml so compiled
        # locks are reproducible.
        uses: github/gh-aw-actions/setup-cli@v0.81.6
        with:
          version: v0.81.6

      - name: Check harness integrity
        run: npm run harness:check

  docker-validate:
    name: Docker image target validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the docs-only check below can diff against the
          # actual merge-base/previous commit rather than a shallow clone's
          # single commit.
          fetch-depth: 0

      - name: Determine whether this change is docs-only
        id: changed
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${GITHUB_SHA}"
          fi

          # A zero SHA (new branch's first push) or an unknown base commit
          # means there is no meaningful diff to inspect -- treat as "not
          # docs-only" so the Docker targets are always validated at least
          # once rather than silently skipped by a diffing edge case.
          docs_only=false
          if [ -n "${base_sha}" ] \
            && [ "${base_sha}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
            if [ -n "${changed_files}" ] && ! printf '%s\n' "${changed_files}" \
              | grep -vqE '^(docs/|specs/|infra/README\.md|README\.md|.*\.md)$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: ${docs_only}"

      - name: Build the web image target
        if: steps.changed.outputs.docs_only != 'true'
        run: docker build --target web -t ci-validate-web:${{ github.sha }} .

      - name: Build the ops image target
        if: steps.changed.outputs.docs_only != 'true'
        run: docker build --target ops -t ci-validate-ops:${{ github.sha }} .

      - name: Skip notice for docs-only change
        if: steps.changed.outputs.docs_only == 'true'
        run: echo "Skipping Docker target validation -- this change only touches documentation."
