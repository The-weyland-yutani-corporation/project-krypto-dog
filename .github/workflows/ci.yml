name: CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'

# Newer pushes to the same branch cancel in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and evidence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck scripts and tests
        # `next build` only typechecks the app code (scripts/ and tests/ are
        # excluded from tsconfig.json). Run a separate pass over them via
        # tsconfig.scripts.json to catch type errors in seed scripts and tests.
        run: npm run typecheck:scripts

      - name: Typecheck (Next.js build)
        # `next build` runs the TypeScript compiler over the app code.
        # Stub env vars so config/Zod schemas resolve without real secrets;
        # build does not call validateEnv() at runtime.
        env:
          ANTHROPIC_FOUNDRY_BASE_URL: https://stub.services.ai.azure.com/anthropic
          ANTHROPIC_FOUNDRY_API_KEY: stub
          ANTHROPIC_FOUNDRY_DEPLOYMENT: claude-sonnet-stub
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          POSTHOG_API_KEY: phc_stub
          CRON_SECRET: stub
          ADMIN_PASSWORD: stub
          ADMIN_SESSION_SECRET: stub
        run: npm run build

      - name: Test critical coverage
        run: npm run test:coverage

      - name: Run all engineering backtests
        run: npm run backtest:all -- --out artifacts/backtest-all.json

      - name: Upload backtest evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-backtest-report
          path: artifacts/backtest-all.json
          if-no-files-found: error

      - name: Generate evidence fixture artifacts
        run: |
          mkdir -p artifacts/evidence
          npm run --silent evidence:import -- \
            --input tests/fixtures/evidence/eth-daily.json \
            --out artifacts/evidence/dataset.json
          jq --arg sha "$GITHUB_SHA" \
            '.implementationCommitSha = $sha' \
            tests/fixtures/evidence/eth-daily-plan.json \
            > artifacts/evidence/plan.json
          npm run --silent evidence:evaluate -- \
            --dataset artifacts/evidence/dataset.json \
            --plan artifacts/evidence/plan.json \
            --json-out artifacts/evidence/report.json \
            --html-out artifacts/evidence/report.html

      - name: Upload evidence fixture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-evidence-fixture-${{ github.sha }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  postgres:
    name: PostgreSQL migrations and execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run migration and transactional integration suite
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:integration

      - name: Reject schema and migration drift
        env:
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"
