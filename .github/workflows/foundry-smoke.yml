name: Foundry smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-smoke-production
  cancel-in-progress: false

jobs:
  smoke:
    name: No-trade model smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Foundry endpoint without trade access
        env:
          ANTHROPIC_FOUNDRY_BASE_URL: ${{ secrets.ANTHROPIC_FOUNDRY_BASE_URL }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_DEPLOYMENT: ${{ secrets.ANTHROPIC_FOUNDRY_DEPLOYMENT }}
        run: npm run smoke:llm
