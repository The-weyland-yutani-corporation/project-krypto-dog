name: Agentic SDLC E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agentic factory path to exercise
        required: true
        default: happy-path
        type: choice
        options:
          - happy-path
          - self-heal

concurrency:
  group: agentic-sdlc-e2e
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  canary:
    name: Exercise native agentic auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANARY_BRANCH: agentic-e2e/${{ github.run_id }}-${{ github.run_attempt }}
      CANARY_PATH: docs/e2e/factory-heartbeat.md

    steps:
      - name: Check out trusted identity policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/agentic-policy.json

      - name: Require human-activated factory mode
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const controls = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "factory-control",
                per_page: 100,
              },
            );
            if (controls.length !== 1) {
              throw new Error(
                `Expected one factory-control issue; found ${controls.length}.`,
              );
            }
            const labels = new Set(
              controls[0].labels.map((label) =>
                typeof label === "string" ? label : label.name,
              ),
            );
            if (!labels.has("factory-mode:active")) {
              throw new Error(
                "The factory must be human-activated before an auto-merge canary.",
              );
            }
            const timeline = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner,
                repo,
                issue_number: controls[0].number,
                per_page: 100,
              },
            );
            const activeEvents = timeline
              .filter(
                (event) =>
                  event.event === "labeled" &&
                  event.label?.name === "factory-mode:active",
              )
              .sort(
                (left, right) =>
                  Date.parse(right.created_at || "") -
                  Date.parse(left.created_at || ""),
              );
            if (
              activeEvents.length === 0 ||
              activeEvents[0].actor?.type !== "User"
            ) {
              throw new Error(
                "Factory active mode is not backed by a current human label event.",
              );
            }

      - name: Create same-repository docs canary
        id: create
        uses: actions/github-script@v9
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.MODE;
            const canaryPath = process.env.CANARY_PATH;
            const defaultBranch = context.payload.repository.default_branch;
            const branch = process.env.CANARY_BRANCH;

            core.setOutput("branch", branch);
            core.setOutput("base_branch", defaultBranch);

            const { data: baseRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });
            const baseSha = baseRef.object.sha;
            const { data: baseCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: baseSha,
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: baseSha,
            });

            const marker = "<!-- agentic-e2e:self-heal -->";
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const contentLines = [
              "# Agentic factory E2E heartbeat",
              "",
              "This stable canary is updated by the manual Agentic SDLC E2E workflow.",
              "",
              `- Last successful candidate: [run ${process.env.GITHUB_RUN_ID}](${runUrl})`,
              `- Mode: \`${mode}\``,
              `- Requested at: \`${new Date().toISOString()}\``,
              "",
            ];
            if (mode === "self-heal") {
              contentLines.push(marker, "");
            }
            const content = contentLines.join("\n");

            const { data: blob } = await github.rest.git.createBlob({
              owner,
              repo,
              content,
              encoding: "utf-8",
            });
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.tree.sha,
              tree: [
                {
                  path: canaryPath,
                  mode: "100644",
                  type: "blob",
                  sha: blob.sha,
                },
              ],
            });

            const identity = {
              name: "github-actions[bot]",
              email: "41898282+github-actions[bot]@users.noreply.github.com",
              date: new Date().toISOString(),
            };
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `docs: refresh agentic factory E2E heartbeat (${mode})`,
              tree: tree.sha,
              parents: [baseSha],
              author: identity,
              committer: identity,
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.sha,
            });

            core.setOutput("initial_sha", commit.sha);
            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: defaultBranch,
              title: `[docs-sync] Agentic SDLC E2E ${mode} canary`,
              body: [
                "Manual end-to-end canary for the deterministic reconciler,",
                "GH-AW review/self-heal, required contexts, and native auto-merge.",
                "",
                `Workflow run: ${runUrl}`,
              ].join("\n"),
              draft: false,
            });
            core.setOutput("pr", String(pull.number));

      - name: Enroll canary for reconciliation
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.create.outputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.PR_NUMBER);

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: [
                "agentic-factory",
                "docs-sync",
                "agentic-automerge",
              ],
            });

      - name: Invoke reconciler
        id: dispatch
        uses: actions/github-script@v9
        env:
          BASE_BRANCH: ${{ steps.create.outputs.base_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dispatchedAt = new Date().toISOString();
            core.setOutput("dispatched_at", dispatchedAt);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "agentic-pr-reconciler.yml",
              ref: process.env.BASE_BRANCH,
            });

      - name: Wait for initial reconciler
        uses: actions/github-script@v9
        env:
          BASE_BRANCH: ${{ steps.create.outputs.base_branch }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 10 * 60 * 1000;
            const dispatchedAt = Date.parse(process.env.DISPATCHED_AT) - 5000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "agentic-pr-reconciler.yml",
                event: "workflow_dispatch",
                branch: process.env.BASE_BRANCH,
                per_page: 20,
              });
              const run = data.workflow_runs.find(
                (candidate) =>
                  Date.parse(candidate.created_at) >= dispatchedAt,
              );

              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  throw new Error(
                    `Initial reconciler run ${run.id} concluded ${run.conclusion}.`,
                  );
                }
                core.info(`Initial reconciler run ${run.id} succeeded.`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            throw new Error("Timed out waiting for the initial reconciler run.");

      - name: Assert required contexts, repair, and merge
        uses: actions/github-script@v9
        env:
          BASE_BRANCH: ${{ steps.create.outputs.base_branch }}
          INITIAL_SHA: ${{ steps.create.outputs.initial_sha }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ steps.create.outputs.pr }}
        with:
          script: |
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const identityPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/agentic-identity.cjs",
            );
            const {
              isGitHubActionsBot,
              isResolvedCopilotActor,
              resolveRepositoryCopilotIdentity,
            } = require(identityPath);
            const copilotIdentity =
              await resolveRepositoryCopilotIdentity({
                github,
                owner,
                repo,
              });
            const pullNumber = Number(process.env.PR_NUMBER);
            const initialSha = process.env.INITIAL_SHA;
            const mode = process.env.MODE;
            const marker = "<!-- agentic-e2e:self-heal -->";
            const requiredChecks = [
              "Quality and evidence gates",
              "PostgreSQL migrations and execution",
              "Agentic code review",
              "Agentic merge policy",
            ];
            const deadline = Date.now() + 75 * 60 * 1000;
            let previousSummary = "";
            let verifiedHead = "";
            let autoMergeEnabledAt = null;

            const latestByName = (checks, name) =>
              checks
                .filter((check) => check.name === name)
                .sort((left, right) => right.id - left.id)[0];

            while (Date.now() < deadline) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              if (pull.state === "closed" && !pull.merged_at) {
                throw new Error(`Canary PR #${pullNumber} closed without merging.`);
              }
              if (pull.merged_at) {
                if (!autoMergeEnabledAt) {
                  throw new Error(
                    `Canary PR #${pullNumber} merged before E2E enabled auto-merge.`,
                  );
                }
                if (pull.head.sha !== verifiedHead) {
                  throw new Error(
                    `Canary PR #${pullNumber} changed head after context verification.`,
                  );
                }
                if (Date.parse(pull.merged_at) < autoMergeEnabledAt) {
                  throw new Error(
                    `Canary PR #${pullNumber} merged before required contexts were verified.`,
                  );
                }
                core.info(
                  `Canary PR #${pullNumber} passed all contexts and merged.`,
                );
                return;
              }
              if (autoMergeEnabledAt && pull.head.sha !== verifiedHead) {
                throw new Error(
                  `Canary PR #${pullNumber} changed head after auto-merge was enabled.`,
                );
              }

              const [checkResponse, commits, files] =
                await Promise.all([
                  github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: pull.head.sha,
                    per_page: 100,
                  }),
                  github.paginate(github.rest.pulls.listCommits, {
                    owner,
                    repo,
                    pull_number: pullNumber,
                    per_page: 100,
                  }),
                  github.paginate(github.rest.pulls.listFiles, {
                    owner,
                    repo,
                    pull_number: pullNumber,
                    per_page: 100,
                  }),
                ]);
              const checks = checkResponse.data.check_runs;
              const canaryScopeIsIntact =
                files.length === 1 &&
                files[0].filename === process.env.CANARY_PATH &&
                ["added", "modified"].includes(files[0].status);
              if (!canaryScopeIsIntact) {
                throw new Error(
                  `Canary PR #${pullNumber} escaped its single-file docs scope.`,
                );
              }

              const checkState = Object.fromEntries(
                requiredChecks.map((name) => {
                  const check = latestByName(checks, name);
                  return [
                    name,
                    check
                      ? `${check.status}/${check.conclusion ?? "pending"}`
                      : "missing",
                  ];
                }),
              );
              const mergePolicy = latestByName(
                checks,
                "Agentic merge policy",
              );
              const allContextsPass =
                requiredChecks.every(
                  (name) =>
                    latestByName(checks, name)?.status === "completed" &&
                    latestByName(checks, name)?.conclusion === "success",
                );
              const passingConclusions = new Set([
                "neutral",
                "skipped",
                "success",
              ]);
              const headIsStable = checks.every(
                (check) =>
                  check.status === "completed" &&
                  passingConclusions.has(check.conclusion),
              );
              const selfHealCommits = commits.filter(
                (commit) =>
                  (isGitHubActionsBot(commit.author) ||
                    isResolvedCopilotActor(
                      commit.author,
                      copilotIdentity,
                    )) &&
                  commit.commit.message.includes("[self-heal]"),
              );
              let repairVerified = mode === "happy-path";
              let initialReviewFailed = mode === "happy-path";
              if (mode === "self-heal") {
                const { data: initialCheckResponse } =
                  await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: initialSha,
                    per_page: 100,
                  });
                const initialChecks = initialCheckResponse.check_runs;
                initialReviewFailed =
                  latestByName(initialChecks, "Agentic code review")
                    ?.conclusion === "failure";

                const { data: file } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: process.env.CANARY_PATH,
                  ref: pull.head.sha,
                });
                if (Array.isArray(file) || file.type !== "file") {
                  throw new Error("Heartbeat path did not resolve to a file.");
                }
                const content = Buffer.from(
                  file.content,
                  "base64",
                ).toString("utf8");
                repairVerified =
                  selfHealCommits.length >= 1 &&
                  selfHealCommits.length <= 2 &&
                  !content.includes(marker) &&
                  content.includes(
                    `run ${process.env.GITHUB_RUN_ID}`,
                  ) &&
                  content.includes(`Mode: \`${mode}\``);
              } else if (selfHealCommits.length > 0) {
                throw new Error(
                  "Happy-path canary unexpectedly received a self-heal commit.",
                );
              }
              const readyForAutoMerge =
                allContextsPass &&
                initialReviewFailed &&
                repairVerified &&
                headIsStable;

              if (readyForAutoMerge && !autoMergeEnabledAt) {
                verifiedHead = pull.head.sha;
                autoMergeEnabledAt =
                  Math.floor(Date.now() / 1000) * 1000;
                await github.rest.checks.create({
                  owner,
                  repo,
                  name: "Agentic merge policy",
                  head_sha: verifiedHead,
                  status: "in_progress",
                  details_url: pull.html_url,
                  output: {
                    title: "Agentic merge policy",
                    summary: "E2E hold while native auto-merge is enabled",
                  },
                });
                await new Promise((resolve) => setTimeout(resolve, 2000));

                let enabled = false;
                let lastError;
                for (let attempt = 1; attempt <= 6; attempt += 1) {
                  try {
                    await github.graphql(
                      `mutation EnableAutoMerge($pullRequestId: ID!) {
                        enablePullRequestAutoMerge(
                          input: {
                            pullRequestId: $pullRequestId
                            mergeMethod: SQUASH
                          }
                        ) {
                          pullRequest { number }
                        }
                      }`,
                      { pullRequestId: pull.node_id },
                    );
                    enabled = true;
                    break;
                  } catch (error) {
                    lastError = error;
                    const message = String(error?.message ?? error);
                    if (
                      !message.includes("clean status") &&
                      !message.includes("unstable status")
                    ) {
                      throw error;
                    }
                    core.info(
                      `Auto-merge state has not settled (attempt ${attempt}/6); retrying.`,
                    );
                    await new Promise((resolve) =>
                      setTimeout(resolve, 2000),
                    );
                  }
                }
                if (!enabled) {
                  throw lastError;
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: "agentic-pr-reconciler.yml",
                  ref: process.env.BASE_BRANCH,
                });
                core.info(
                  `Verified all required contexts on ${verifiedHead}; enabled native auto-merge.`,
                );
              }

              const summary = JSON.stringify({
                head: pull.head.sha,
                checks: checkState,
                mergePolicy: mergePolicy
                  ? `${mergePolicy.status}/${mergePolicy.conclusion ?? "pending"}`
                  : "missing",
                initialReviewFailed,
                repairVerified,
                selfHealCommits: selfHealCommits.length,
                headIsStable,
                autoMergeEnabled: Boolean(autoMergeEnabledAt),
              });
              if (summary !== previousSummary) {
                core.info(summary);
                previousSummary = summary;
              }

              const labels = new Set(
                pull.labels.map((label) => label.name),
              );
              if (
                labels.has("blocked") ||
                labels.has("self-heal-exhausted")
              ) {
                throw new Error(
                  `Canary PR #${pullNumber} entered a blocked state.`,
                );
              }

              await new Promise((resolve) => setTimeout(resolve, 20000));
            }

            throw new Error(
              `Timed out waiting for canary PR #${pullNumber} to merge.`,
            );

      - name: Clean up canary
        if: always()
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ env.CANARY_BRANCH }}
          PR_NUMBER: ${{ steps.create.outputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.PR_NUMBER || "0");

            try {
              if (pullNumber) {
                const { data: pull } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullNumber,
                });
                if (pull.state === "open" && !pull.merged_at) {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pullNumber,
                    state: "closed",
                  });
                }
              }
            } finally {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${process.env.BRANCH}`,
                });
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) {
                  throw error;
                }
                core.info("Canary branch was already deleted.");
              }
            }
