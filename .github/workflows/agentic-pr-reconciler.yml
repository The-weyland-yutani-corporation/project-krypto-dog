name: Agentic PR Reconciler

on:
  workflow_dispatch:
    inputs:
      backfill_deprecated_checks:
        description: Cancel active legacy policy checks on historical PR heads
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  issues:
    types: [labeled, unlabeled]
  workflow_run:
    workflows:
      [CI, Code Review, PR Self Heal, QA Test Plan, Security Review, Trading Safety Review]
    types: [completed]

concurrency:
  group: agentic-pr-reconciler
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  # PR label mutations require Pull requests write even through the Issues API.
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile agentic pull requests
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.label.name, 'factory-mode:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted reconciler implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/agentic-policy.json

      - name: Reconcile checks, policy, and repair
        id: reconcile
        uses: actions/github-script@v9
        env:
          FACTORY_ASSIGNMENT_ACTOR_NODE_ID: ${{ vars.FACTORY_ASSIGNMENT_ACTOR_NODE_ID }}
        with:
          script: |
            const path = require("node:path");
            const reconcilerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/agentic-pr-reconciler.cjs",
            );
            const { reconcileAgenticPullRequests } = require(reconcilerPath);
            const approved = [];
            const dispatches = [];
            const dispatchIdentity = { runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) };
            try {
            await reconcileAgenticPullRequests({
              autonomous: require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-policy.cjs")).AGENTIC_POLICY.autonomy.enabled,
              github,
              context,
              core,
              assignmentActorNodeId:
                process.env.FACTORY_ASSIGNMENT_ACTOR_NODE_ID,
              onVerifiedMerge: async (item) => approved.push(item),
              onDispatch: async (item) => dispatches.push(item),
              dispatchIdentity,
            });
            core.setOutput("approved_merges", JSON.stringify(approved));
            } finally {
              require("node:fs").writeFileSync(path.join(process.env.RUNNER_TEMP, "receipt.json"), JSON.stringify({
                schemaVersion: 1, ...dispatchIdentity, dispatches,
              }));
            }

      - name: Preserve controller dispatch receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-dispatches-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact-head merges
        if: ${{ steps.reconcile.outputs.approved_merges != '' && steps.reconcile.outputs.approved_merges != '[]' }}
        uses: actions/github-script@v9
        env:
          APPROVED_MERGES: ${{ steps.reconcile.outputs.approved_merges }}
          MERGE_TOKEN_CONFIGURED: ${{ secrets.GH_AW_AGENT_TOKEN != '' }}
          FACTORY_ASSIGNMENT_ACTOR_NODE_ID: ${{ vars.FACTORY_ASSIGNMENT_ACTOR_NODE_ID }}
        with:
          # A non-GITHUB_TOKEN publisher preserves push-triggered CI/deployment
          # events. The existing credential is confined to this trusted step.
          github-token: ${{ secrets.GH_AW_AGENT_TOKEN }}
          script: |
            if (process.env.MERGE_TOKEN_CONFIGURED !== "true") {
              throw new Error("GH_AW_AGENT_TOKEN is required for merges that trigger downstream CI; no token fallback is permitted.");
            }
            const { mergeVerifiedHead } = require(
              require("node:path").join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-merge.cjs"),
            );
            const approved = JSON.parse(process.env.APPROVED_MERGES);
            if (!Array.isArray(approved)) throw new Error("Invalid merge publication batch.");
            for (const item of approved) {
              if (!Number.isSafeInteger(item.number) || item.number <= 0 || !/^[0-9a-f]{40}$/.test(item.headSha)) {
                throw new Error("Invalid exact-head merge publication target.");
              }
              await mergeVerifiedHead({
                github, ...context.repo, core,
                pullRequest: { number: item.number, head: { sha: item.headSha } },
                assignmentActorNodeId: process.env.FACTORY_ASSIGNMENT_ACTOR_NODE_ID,
                serverUrl: context.serverUrl,
              });
            }
