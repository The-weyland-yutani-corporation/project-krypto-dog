name: Azure promote prod

# Manual, two-action promotion of an already-deployed, already-target-smoke-passed
# prod release into shadow/paper trading and finally into a live schedule
# (ADR 0008 items 11-12). This workflow NEVER deploys release.bicep and
# NEVER touches PostgreSQL/Key Vault/evidence storage -- its only
# permitted deploy target is infra/rollout.bicep for the prod resource
# group, matching the `production-promotion` identity's documented scope
# (infra/README.md: "prod promotion ... rollout.bicep for prod only").
#
# Two explicit, separately-invoked actions so attended human review always
# happens between them:
#   - `prepare`: deploys the requested shadow/paper mode with BOTH
#     scheduler trigger types left at their committed Manual default, runs
#     activation-check, and runs exactly one manual (not scheduled)
#     execution of the hourly agent-run job so it is proven to behave
#     correctly bound to the new ROLLOUT_MODE before any schedule exists.
#     `paper` additionally requires an explicit typed acknowledgement
#     input and runs preflight + a verified backup first. Exits with both
#     trigger types still Manual -- `prepare` alone can NEVER cause a
#     scheduled trading run.
#   - `activate`: reruns activation-check against the CURRENTLY deployed
#     mode/image (queried live, never re-supplied), then deploys
#     rollout.bicep again with only the two trigger types flipped to
#     Schedule. This is the only step in this entire deployment layer that
#     can turn on a schedule.
#
# Both actions require the exact 40-hex release SHA and sha256 image
# digest that a passed azure-deploy-prod.yml target-smoke evidence report
# already exists for, and refuse to proceed otherwise (fail closed).
#
# IMPORTANT: paper mode enables PAPER TRADING ONLY. Nothing in this
# workflow, including the `paper_trading_acknowledgement` input, ever
# authorizes live trading with real funds.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'prepare (deploy shadow/paper, schedules stay Manual) or activate (flip schedules to Schedule).'
        required: true
        type: choice
        options:
          - prepare
          - activate
      release_sha:
        description: 'Exact 40-hex commit SHA of the release already deployed by azure-deploy-prod.yml.'
        required: true
        type: string
      image_digest:
        description: 'sha256:<64-hex> digest of the web image for this release (must match the passed target-smoke evidence).'
        required: true
        type: string
      target_smoke_execution_id:
        description: 'Exact JOB_EXECUTION_ID of the PASSED target-smoke run for this release/digest (surfaced in the azure-deploy-prod.yml or azure-rotate-secrets.yml run summary/artifact that produced it). The most-recently-written evidence is never trusted automatically.'
        required: true
        type: string
      app_mode:
        description: 'Required only for action=prepare: shadow or paper. Ignored for action=activate (the current live mode is used).'
        required: false
        type: choice
        options:
          - ''
          - shadow
          - paper
      paper_trading_acknowledgement:
        description: 'Required only for action=prepare with app_mode=paper. Must be typed exactly: I ACKNOWLEDGE THIS DOES NOT AUTHORIZE LIVE TRADING'
        required: false
        type: string

concurrency:
  group: azure-promote-prod-production-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_RESOURCE_GROUP_NAME: ${{ vars.PROD_RESOURCE_GROUP_NAME }}
  FOUNDRY_RESOURCE_NAME: ${{ vars.FOUNDRY_RESOURCE_NAME }}
  OPS_JOB_TIMEOUT_SECONDS: '1800'
  PAPER_ACK_PHRASE: 'I ACKNOWLEDGE THIS DOES NOT AUTHORIZE LIVE TRADING'
  # Fixed, deterministic names matching infra/environment.bicep and
  # infra/params/{environment,release,rollout}.prod.bicepparam exactly (not
  # re-derived) -- if those committed files ever change these names, these
  # must be updated to match.
  ACR_NAME: acrkryptoprod
  CONTAINER_APPS_ENVIRONMENT_NAME: cae-krypto-prod
  RUNTIME_IDENTITY_NAME: id-krypto-prod-runtime
  SCHEDULER_IDENTITY_NAME: id-krypto-prod-scheduler
  WEB_APP_NAME: ca-prod-web
  PREFLIGHT_JOB_NAME: caj-prod-preflight
  VERIFIED_BACKUP_JOB_NAME: caj-prod-verified-backup
  ACTIVATION_CHECK_JOB_NAME: caj-prod-activation-check
  PROD_HOURLY_JOB_NAME: caj-prod-agent-run
  EVIDENCE_STORAGE_ACCOUNT_NAME: stkryptoprodevid

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
      INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
      INPUT_APP_MODE: ${{ inputs.app_mode }}
      INPUT_PAPER_ACK: ${{ inputs.paper_trading_acknowledgement }}
      INPUT_TARGET_SMOKE_EXECUTION_ID: ${{ inputs.target_smoke_execution_id }}
    outputs:
      action: ${{ steps.validate.outputs.action }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      image_digest: ${{ steps.validate.outputs.image_digest }}
      image_digest_hex: ${{ steps.validate.outputs.image_digest_hex }}
      app_mode: ${{ steps.validate.outputs.app_mode }}
      target_smoke_execution_id: ${{ steps.validate.outputs.target_smoke_execution_id }}
    steps:
      - name: Checkout (for lib/common.sh only)
        uses: actions/checkout@v4

      - name: Validate action, release SHA, image digest, target-smoke execution ID, and mode-specific inputs
        id: validate
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh

          release_sha="$(azure_validate_release_sha "${INPUT_RELEASE_SHA}")"

          image_digest="${INPUT_IMAGE_DIGEST}"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be exactly 'sha256:' followed by 64 lowercase hex characters." >&2
            exit 1
          fi
          image_digest_hex="${image_digest#sha256:}"

          target_smoke_execution_id="$(azure_validate_job_execution_id "${INPUT_TARGET_SMOKE_EXECUTION_ID}")"

          action="${INPUT_ACTION}"
          app_mode="${INPUT_APP_MODE}"
          if [ "${action}" = "prepare" ]; then
            if [ "${app_mode}" != "shadow" ] && [ "${app_mode}" != "paper" ]; then
              echo "action=prepare requires app_mode to be exactly 'shadow' or 'paper'." >&2
              exit 1
            fi
            if [ "${app_mode}" = "paper" ]; then
              ack="${INPUT_PAPER_ACK}"
              if [ "${ack}" != "${PAPER_ACK_PHRASE}" ]; then
                echo "action=prepare with app_mode=paper requires paper_trading_acknowledgement to be typed exactly: ${PAPER_ACK_PHRASE}" >&2
                exit 1
              fi
            fi
          elif [ "${action}" = "activate" ]; then
            if [ -n "${app_mode}" ]; then
              echo "action=activate derives the live mode itself and does not accept app_mode -- leave it blank." >&2
              exit 1
            fi
          else
            echo "Unknown action '${action}'." >&2
            exit 1
          fi

          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
          echo "image_digest_hex=${image_digest_hex}" >> "$GITHUB_OUTPUT"
          echo "app_mode=${app_mode}" >> "$GITHUB_OUTPUT"
          echo "target_smoke_execution_id=${target_smoke_execution_id}" >> "$GITHUB_OUTPUT"

  verify-target-smoke-evidence:
    name: Locate and validate the passed target-smoke evidence for this release/digest
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-promotion
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.validate-inputs.outputs.release_sha }}
      IMAGE_DIGEST: ${{ needs.validate-inputs.outputs.image_digest }}
      TARGET_SMOKE_EXECUTION_ID: ${{ needs.validate-inputs.outputs.target_smoke_execution_id }}
    outputs:
      container_url: ${{ steps.evidence.outputs.container_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the evidence container URL
        id: evidence
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          blob_endpoint="$(az storage account show \
            --name "${EVIDENCE_STORAGE_ACCOUNT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query primaryEndpoints.blob \
            --output tsv)"
          if [ -z "${blob_endpoint}" ]; then
            echo "Could not resolve the primary blob endpoint for storage account '${EVIDENCE_STORAGE_ACCOUNT_NAME}'." >&2
            exit 1
          fi
          container_url="$(azure_validate_container_url "${blob_endpoint%/}/evidence")"
          echo "container_url=${container_url}" >> "$GITHUB_OUTPUT"

      # Fix 5 (security review): promotion NEVER trusts a "most recent
      # evidence" lookup (find-latest-evidence.sh's newest-by-lastModified
      # semantics would let a stale or even attacker-influenceable rerun
      # silently win). The operator must instead supply the EXACT
      # JOB_EXECUTION_ID of the specific PASSED target-smoke run they
      # reviewed (surfaced in that run's own summary/artifact by
      # azure-deploy-prod.yml / azure-rotate-secrets.yml), already
      # format-validated by validate-inputs. This job only ever downloads
      # that one exact, immutable prefix.
      - name: Download the exact validated target-smoke evidence
        run: |
          set -euo pipefail
          .github/scripts/azure/download-evidence.sh \
            --container-url "${{ steps.evidence.outputs.container_url }}" \
            --environment-name prod \
            --release-sha "${RELEASE_SHA}" \
            --operation target-smoke \
            --job-execution-id "${TARGET_SMOKE_EXECUTION_ID}" \
            --destination evidence

      - name: Validate the target-smoke report matches this exact release SHA and image digest, and passed
        run: |
          set -euo pipefail
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RELEASE_SHA}/target-smoke/${TARGET_SMOKE_EXECUTION_ID}/report.json" \
            --operation target-smoke \
            --release-sha "${RELEASE_SHA}" \
            --image-digest "${IMAGE_DIGEST}"

      - name: Confirm rollout imageDigest input equals the validated target-smoke report digest
        run: |
          set -euo pipefail
          # Fix 6 (security review): re-confirm the digest binding
          # explicitly and independently of validate-report.mjs's own
          # internal check, so this exact assertion is visible in the run
          # log immediately before any rollout.bicep deploy is permitted
          # to proceed (both `prepare` and `activate` depend on this job).
          report_digest="$(jq -r '.imageDigest // empty' \
            "evidence/prod/${RELEASE_SHA}/target-smoke/${TARGET_SMOKE_EXECUTION_ID}/report.json")"
          if [ -z "${report_digest}" ]; then
            echo "target-smoke report is missing 'imageDigest' -- failing closed." >&2
            exit 1
          fi
          if [ "${report_digest}" != "${IMAGE_DIGEST}" ]; then
            echo "target-smoke report imageDigest '${report_digest}' does not equal the image_digest input '${IMAGE_DIGEST}' -- refusing to proceed to any rollout.bicep deploy." >&2
            exit 1
          fi
          echo "Confirmed: rollout imageDigest input equals the validated target-smoke report digest (${report_digest})."

  prepare:
    name: 'Action: prepare (deploy shadow/paper, schedules stay Manual)'
    if: inputs.action == 'prepare'
    needs: [validate-inputs, verify-target-smoke-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-promotion
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.validate-inputs.outputs.release_sha }}
      IMAGE_DIGEST: ${{ needs.validate-inputs.outputs.image_digest }}
      IMAGE_DIGEST_HEX: ${{ needs.validate-inputs.outputs.image_digest_hex }}
      APP_MODE: ${{ needs.validate-inputs.outputs.app_mode }}
      EVIDENCE_CONTAINER_URL: ${{ needs.verify-target-smoke-evidence.outputs.container_url }}
    steps:
      - name: Checkout ${{ needs.validate-inputs.outputs.release_sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-inputs.outputs.release_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve live resource IDs required by rollout.bicep
        id: resolve
        run: |
          set -euo pipefail
          cae_id="$(az containerapp env show \
            --name "${CONTAINER_APPS_ENVIRONMENT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          acr_login_server="$(az acr show \
            --name "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query loginServer --output tsv)"
          runtime_identity_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          scheduler_identity_id="$(az identity show \
            --name "${SCHEDULER_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          for pair in "cae_id=${cae_id}" "acr_login_server=${acr_login_server}" "runtime_identity_id=${runtime_identity_id}" "scheduler_identity_id=${scheduler_identity_id}"; do
            if [ -z "${pair#*=}" ]; then
              echo "Failed to resolve one of the required live resource IDs (${pair%%=*} was empty)." >&2
              exit 1
            fi
          done
          echo "cae_id=${cae_id}" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_login_server}" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_id=${runtime_identity_id}" >> "$GITHUB_OUTPUT"
          echo "scheduler_identity_id=${scheduler_identity_id}" >> "$GITHUB_OUTPUT"

      - name: Render rollout.prod.bicepparam (requested app mode, schedules Manual)
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/rollout.prod.bicepparam \
            --out /tmp/rollout.prod.resolved.bicepparam \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${{ steps.resolve.outputs.cae_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${{ steps.resolve.outputs.acr_login_server }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${{ steps.resolve.outputs.runtime_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${{ steps.resolve.outputs.scheduler_identity_id }}" \
            --set REPLACE_WITH_CURRENTLY_RELEASED_DIGEST="${IMAGE_DIGEST_HEX}" \
            --set REPLACE_WITH_FOUNDRY_RESOURCE="${FOUNDRY_RESOURCE_NAME}" \
            --set-string-param rolloutMode="${APP_MODE}"

      - name: What-if infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-rollout.json

      - name: Reject unsafe what-if deletes
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-rollout.json

      - name: Deploy infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "roll-prod-prepare-${{ github.run_id }}-${{ github.run_attempt }}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.resolved.bicepparam \
            --query properties.outputs \
            --output json > /tmp/rollout-outputs.json
          cat /tmp/rollout-outputs.json

      - name: Confirm the deploy landed exactly on the requested mode with schedules still Manual
        run: |
          set -euo pipefail
          rollout_mode="$(jq -r '.rolloutMode.value // empty' /tmp/rollout-outputs.json)"
          hourly_trigger_type="$(jq -r '.hourlyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          daily_trigger_type="$(jq -r '.dailyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          if [ "${rollout_mode}" != "${APP_MODE}" ]; then
            echo "Deployed rolloutMode '${rollout_mode}' does not match requested app_mode '${APP_MODE}' -- failing closed." >&2
            exit 1
          fi
          if [ "${hourly_trigger_type}" != "Manual" ] || [ "${daily_trigger_type}" != "Manual" ]; then
            echo "prepare must leave both trigger types Manual, but got hourly='${hourly_trigger_type}' daily='${daily_trigger_type}' -- failing closed." >&2
            exit 1
          fi
          echo "Confirmed: rolloutMode=${rollout_mode}, hourlyTriggerType=Manual, dailyTriggerType=Manual."

      - name: 'Paper only: run preflight for the current release'
        if: needs.validate-inputs.outputs.app_mode == 'paper'
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id preflight)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RELEASE_SHA}" \
            --operation preflight \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RELEASE_SHA}/preflight/${job_execution_id}/report.json" \
            --operation preflight \
            --release-sha "${RELEASE_SHA}"

      - name: 'Paper only: run a verified backup for the current release'
        if: needs.validate-inputs.outputs.app_mode == 'paper'
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id verified-backup)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${VERIFIED_BACKUP_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RELEASE_SHA}" \
            --operation verified-backup \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RELEASE_SHA}/verified-backup/${job_execution_id}/report.json" \
            --operation verified-backup \
            --release-sha "${RELEASE_SHA}"

      - name: Run activation-check
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id activation-check)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${ACTIVATION_CHECK_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RELEASE_SHA}" \
            --operation activation-check \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RELEASE_SHA}/activation-check/${job_execution_id}/report.json" \
            --operation activation-check \
            --release-sha "${RELEASE_SHA}" \
            --image-digest "${IMAGE_DIGEST}"

      - name: Run one manual mode-bound hourly job execution (proves the new ROLLOUT_MODE before any schedule exists)
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_validate_job_execution_id "run${{ github.run_id }}-a${{ github.run_attempt }}-manual-hourly-check")"
          # scripts/scheduled-trigger.mjs (this job's entrypoint) is not an
          # ops-job.ts-based operation and does not write an evidence
          # report.json -- JOB_EXECUTION_ID is still passed for a
          # consistent, traceable env var, but there is nothing to
          # download or validate afterwards; polling to a Succeeded
          # terminal state is itself the pass signal for this step.
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${PROD_HOURLY_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"

      - name: Publish downloaded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-promote-prod-prepare-evidence-${{ needs.validate-inputs.outputs.release_sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Closing summary
        run: |
          set -euo pipefail
          echo "prepare complete for release ${RELEASE_SHA} with rolloutMode=${APP_MODE} and both trigger types Manual."
          echo "Schedules remain Manual. No trading job runs on a schedule as a result of this action."
          echo "This does not authorize live trading -- ${APP_MODE} mode only. Run action=activate after attended review to enable the schedule."

  activate:
    name: 'Action: activate (flip schedules to Schedule)'
    if: inputs.action == 'activate'
    needs: [validate-inputs, verify-target-smoke-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-promotion
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.validate-inputs.outputs.release_sha }}
      IMAGE_DIGEST: ${{ needs.validate-inputs.outputs.image_digest }}
      IMAGE_DIGEST_HEX: ${{ needs.validate-inputs.outputs.image_digest_hex }}
      EVIDENCE_CONTAINER_URL: ${{ needs.verify-target-smoke-evidence.outputs.container_url }}
    steps:
      - name: Checkout ${{ needs.validate-inputs.outputs.release_sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-inputs.outputs.release_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the currently live rollout mode and image digest (never re-supplied by the operator)
        id: live
        run: |
          set -euo pipefail
          live_mode="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='ROLLOUT_MODE'].value | [0]" \
            --output tsv)"
          if [ "${live_mode}" != "shadow" ] && [ "${live_mode}" != "paper" ]; then
            echo "Currently deployed ROLLOUT_MODE is '${live_mode}', not shadow/paper -- run action=prepare first. Refusing to activate." >&2
            exit 1
          fi

          live_image="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].image" \
            --output tsv)"
          case "${live_image}" in
            *@sha256:*)
              live_digest="sha256:${live_image##*@sha256:}"
              ;;
            *)
              echo "Currently deployed web image '${live_image}' is not digest-pinned -- refusing to activate." >&2
              exit 1
              ;;
          esac
          if [ "${live_digest}" != "${IMAGE_DIGEST}" ]; then
            echo "Currently deployed image digest '${live_digest}' does not match the image_digest input '${IMAGE_DIGEST}' -- refusing to activate a mismatched release." >&2
            exit 1
          fi

          echo "live_mode=${live_mode}" >> "$GITHUB_OUTPUT"

      - name: Run activation-check against the currently live release
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id activation-check)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${ACTIVATION_CHECK_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RELEASE_SHA}" \
            --operation activation-check \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RELEASE_SHA}/activation-check/${job_execution_id}/report.json" \
            --operation activation-check \
            --release-sha "${RELEASE_SHA}" \
            --image-digest "${IMAGE_DIGEST}"

      - name: Resolve live resource IDs required by rollout.bicep
        id: resolve
        run: |
          set -euo pipefail
          cae_id="$(az containerapp env show \
            --name "${CONTAINER_APPS_ENVIRONMENT_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          acr_login_server="$(az acr show \
            --name "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query loginServer --output tsv)"
          runtime_identity_id="$(az identity show \
            --name "${RUNTIME_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          scheduler_identity_id="$(az identity show \
            --name "${SCHEDULER_IDENTITY_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query id --output tsv)"
          for pair in "cae_id=${cae_id}" "acr_login_server=${acr_login_server}" "runtime_identity_id=${runtime_identity_id}" "scheduler_identity_id=${scheduler_identity_id}"; do
            if [ -z "${pair#*=}" ]; then
              echo "Failed to resolve one of the required live resource IDs (${pair%%=*} was empty)." >&2
              exit 1
            fi
          done
          echo "cae_id=${cae_id}" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_login_server}" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_id=${runtime_identity_id}" >> "$GITHUB_OUTPUT"
          echo "scheduler_identity_id=${scheduler_identity_id}" >> "$GITHUB_OUTPUT"

      - name: Render rollout.prod.bicepparam (exact current image/mode, both trigger types Schedule)
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/rollout.prod.bicepparam \
            --out /tmp/rollout.prod.resolved.bicepparam \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${{ steps.resolve.outputs.cae_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${{ steps.resolve.outputs.acr_login_server }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${{ steps.resolve.outputs.runtime_identity_id }}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${{ steps.resolve.outputs.scheduler_identity_id }}" \
            --set REPLACE_WITH_CURRENTLY_RELEASED_DIGEST="${IMAGE_DIGEST_HEX}" \
            --set REPLACE_WITH_FOUNDRY_RESOURCE="${FOUNDRY_RESOURCE_NAME}" \
            --set-string-param rolloutMode="${{ steps.live.outputs.live_mode }}" \
            --set-string-param hourlyTriggerType=Schedule \
            --set-string-param dailyTriggerType=Schedule

      - name: What-if infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-rollout.json

      - name: Reject unsafe what-if deletes
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-rollout.json

      - name: Deploy infra/rollout.bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "roll-prod-activate-${{ github.run_id }}-${{ github.run_attempt }}" \
            --template-file infra/rollout.bicep \
            --parameters /tmp/rollout.prod.resolved.bicepparam \
            --query properties.outputs \
            --output json > /tmp/rollout-outputs.json
          cat /tmp/rollout-outputs.json

      - name: Confirm both schedules are now enabled with the expected mode/image unchanged
        run: |
          set -euo pipefail
          rollout_mode="$(jq -r '.rolloutMode.value // empty' /tmp/rollout-outputs.json)"
          hourly_trigger_type="$(jq -r '.hourlyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          daily_trigger_type="$(jq -r '.dailyTriggerType.value // empty' /tmp/rollout-outputs.json)"
          if [ "${rollout_mode}" != "${{ steps.live.outputs.live_mode }}" ]; then
            echo "Deployed rolloutMode '${rollout_mode}' changed from the live mode '${{ steps.live.outputs.live_mode }}' -- activate must never change the mode -- failing closed." >&2
            exit 1
          fi
          if [ "${hourly_trigger_type}" != "Schedule" ] || [ "${daily_trigger_type}" != "Schedule" ]; then
            echo "activate must land both trigger types on Schedule, but got hourly='${hourly_trigger_type}' daily='${daily_trigger_type}' -- failing closed." >&2
            exit 1
          fi
          echo "Confirmed: rolloutMode=${rollout_mode} (unchanged), hourlyTriggerType=Schedule, dailyTriggerType=Schedule."

      - name: Publish downloaded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-promote-prod-activate-evidence-${{ needs.validate-inputs.outputs.release_sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Closing summary
        run: |
          set -euo pipefail
          echo "activate complete for release ${RELEASE_SHA} with rolloutMode=${{ steps.live.outputs.live_mode }} (unchanged) and both trigger types Schedule."
          echo "Both scheduler jobs are now enabled and will run on their fixed cron expressions."
