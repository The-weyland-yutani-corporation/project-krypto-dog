name: Azure deploy prod

# Automatic prod deploy after a successful CI run on the exact `main`
# branch (a push-triggered CI run only), plus a manual workflow_dispatch
# escape hatch. Always checks out the exact commit SHA the triggering CI
# run validated. Existing releases pass the `production-promotion` approval
# before forced disable, then the separate `production-deploy` approval for
# current-release safety and infrastructure/release work.
#
# Safety ordering (ADR 0008 items 11-12, infra/README.md):
#   1. Detect the complete current release from deterministic resource
#      names. If it exists, resolve the rollout/evidence inputs from live
#      Azure state and force rollout.bicep to disabled/Manual under the
#      separately protected `production-promotion` identity.
#   2. Run and evidence-validate the CURRENT release's preflight and
#      verified backup under `production-deploy`.
#   3. Only after those controls pass may environment.bicep rotate the
#      PostgreSQL administrator credential or mutate infrastructure. A
#      genuinely fresh environment skips the current-release backup.
#   4. Manual `foundation` runs stop successfully after environment.bicep
#      and publish the nonsecret identity/ACS/evidence handoff. Automatic
#      runs always use `full`.
#   5. Full runs build digest-pinned images, deploy release.bicep
#      disabled/Manual, then run migrate-init, baseline verified-backup,
#      and target-smoke.
#   6. Live final-state verification proves disabled/Manual, no schedule,
#      exact release SHA, and exact web/ops digests. This workflow never
#      promotes shadow/paper or enables a schedule.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-hex commit SHA to deploy. Required for manual dispatch."
        required: true
        type: string
      deployment_stage:
        description: "foundation stops after environment.bicep; full performs the complete disabled production release."
        required: true
        default: full
        type: choice
        options:
          - foundation
          - full

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_RESOURCE_GROUP_NAME: ${{ vars.PROD_RESOURCE_GROUP_NAME }}
  OPS_JOB_TIMEOUT_SECONDS: "1800"
  # Fixed, deterministic names matching infra/params/release.prod.bicepparam
  # and infra/params/rollout.prod.bicepparam exactly (not re-derived) --
  # if those committed files are ever changed to use different names,
  # these must be updated to match.
  PREFLIGHT_JOB_NAME: caj-prod-preflight
  VERIFIED_BACKUP_JOB_NAME: caj-prod-verified-backup
  WEB_APP_NAME: ca-prod-web
  MIGRATE_INIT_JOB_NAME: caj-prod-migrate-init
  TARGET_SMOKE_JOB_NAME: caj-prod-target-smoke
  ACTIVATION_CHECK_JOB_NAME: caj-prod-activation-check
  PROD_HOURLY_JOB_NAME: caj-prod-agent-run
  PROD_DAILY_JOB_NAME: caj-prod-daily-summary
  ACR_NAME: acrkryptoprod
  CONTAINER_APPS_ENVIRONMENT_NAME: cae-krypto-prod
  RUNTIME_IDENTITY_NAME: id-krypto-prod-runtime
  SCHEDULER_IDENTITY_NAME: id-krypto-prod-scheduler
  EVIDENCE_STORAGE_ACCOUNT_NAME: stkryptoprodevid
  SAFETY_PRIMARY_ON_CALL_PROD: ${{ vars.KRYPTO_SAFETY_PRIMARY_ON_CALL || '[required-primary-on-call]' }}
  SAFETY_BACKUP_ON_CALL_PROD: ${{ vars.KRYPTO_SAFETY_BACKUP_ON_CALL || '[required-backup-on-call]' }}
  SAFETY_RELEASE_OWNER_PROD: ${{ vars.KRYPTO_SAFETY_RELEASE_OWNER || '[required-release-owner]' }}
  SAFETY_APPROVER_PROD: ${{ vars.KRYPTO_SAFETY_APPROVER || '[required-safety-approver]' }}
  SAFETY_EVIDENCE_CUSTODIAN_PROD: ${{ vars.KRYPTO_SAFETY_EVIDENCE_CUSTODIAN || '[required-evidence-custodian]' }}
  SAFETY_ROLLBACK_OWNER_PROD: ${{ vars.KRYPTO_SAFETY_ROLLBACK_OWNER || '[required-rollback-owner]' }}
  SAFETY_PRIMARY_ON_CALL_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_PRIMARY_ON_CALL_PUBLIC_KEY || '[required-primary-public-key]' }}
  SAFETY_BACKUP_ON_CALL_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_BACKUP_ON_CALL_PUBLIC_KEY || '[required-backup-public-key]' }}
  SAFETY_RELEASE_OWNER_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_RELEASE_OWNER_PUBLIC_KEY || '[required-release-public-key]' }}
  SAFETY_APPROVER_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_APPROVER_PUBLIC_KEY || '[required-approver-public-key]' }}
  SAFETY_EVIDENCE_CUSTODIAN_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_EVIDENCE_CUSTODIAN_PUBLIC_KEY || '[required-custodian-public-key]' }}
  SAFETY_ROLLBACK_OWNER_PUBLIC_KEY_PROD: ${{ vars.KRYPTO_SAFETY_ROLLBACK_OWNER_PUBLIC_KEY || '[required-rollback-public-key]' }}

jobs:
  gate:
    name: Determine and validate the commit to deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
      INPUT_DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      deployment_stage: ${{ steps.resolve.outputs.deployment_stage }}
    steps:
      # fetch-depth: 0 is required so verify-deploy-sha.sh's
      # `git merge-base --is-ancestor` (manual-dispatch path only) can
      # walk the FULL commit history, not just a shallow tip.
      - name: Checkout (full history, for lib/common.sh and SHA verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and format-validate the exact commit SHA to deploy
        id: resolve
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            candidate="${INPUT_COMMIT_SHA}"
          else
            candidate="${WORKFLOW_RUN_HEAD_SHA}"
          fi
          source .github/scripts/azure/lib/common.sh
          validated="$(azure_validate_release_sha "${candidate}")"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            deployment_stage="${INPUT_DEPLOYMENT_STAGE}"
          else
            deployment_stage="full"
          fi
          if [ "${deployment_stage}" != "foundation" ] && [ "${deployment_stage}" != "full" ]; then
            echo "deployment_stage must be exactly 'foundation' or 'full'." >&2
            exit 1
          fi
          echo "sha=${validated}" >> "$GITHUB_OUTPUT"
          echo "deployment_stage=${deployment_stage}" >> "$GITHUB_OUTPUT"
          echo "Resolved candidate commit ${validated} (event=${EVENT_NAME}, deployment_stage=${deployment_stage})."

      # The automatic workflow_run path is already provably safe by
      # construction (see this job's `if:` condition). A manually
      # dispatched SHA is arbitrary operator input and must additionally have
      # successful push CI and be on the branch authorized for its stage:
      # foundation may come from protected develop/azure; full requires main.
      - name: Verify manually-dispatched SHA branch and successful push CI
        if: env.EVENT_NAME == 'workflow_dispatch'
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          DEPLOYMENT_STAGE: ${{ steps.resolve.outputs.deployment_stage }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target_branch=main
          if [ "${DEPLOYMENT_STAGE}" = "foundation" ]; then
            target_branch=develop/azure
          fi
          .github/scripts/azure/verify-deploy-sha.sh \
            --sha "${RESOLVED_SHA}" \
            --branch "${target_branch}" \
            --repo "${TARGET_REPO}" \
            --ci-workflow ci.yml

  force-disable-rollout:
    name: Detect current release and force disabled/Manual before infrastructure mutation
    # Uses the `production-promotion` Environment/identity -- NOT
    # `production-deploy` -- for the rollout.bicep deploy specifically.
    # infra/README.md's GitHub Environments table documents this as a
    # process/workflow control (Azure RBAC alone would not stop the
    # prod-deploy identity from also deploying rollout.bicep, since both
    # identities hold Contributor on the same resource group): "prod
    # deploy ... never rollout.bicep" / "prod promotion ... rollout.bicep
    # for prod only". Splitting this into its own job/Environment means a
    # single azure-deploy-prod.yml run pauses for the production-promotion
    # reviewers to approve the forced disable, then separately for the
    # production-deploy reviewers to approve the actual release deploy --
    # matching "each is a distinct, separately-reviewable GitHub
    # Environment approval gate."
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-promotion
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
    outputs:
      existing_release: ${{ steps.detect.outputs.existing_release }}
      current_sha: ${{ steps.current.outputs.sha }}
      current_digest: ${{ steps.current.outputs.digest }}
      evidence_container_url: ${{ steps.live.outputs.evidence_container_url }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Verify live production-promotion approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-promotion

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Detect a complete existing release or a genuinely fresh environment
        id: detect
        run: |
          set -euo pipefail
          jobs_json="$(az containerapp job list \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          apps_json="$(az containerapp list \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          required_jobs=(
            "${PROD_HOURLY_JOB_NAME}"
            "${PROD_DAILY_JOB_NAME}"
            "${MIGRATE_INIT_JOB_NAME}"
            "${PREFLIGHT_JOB_NAME}"
            "${VERIFIED_BACKUP_JOB_NAME}"
            "${TARGET_SMOKE_JOB_NAME}"
            "${ACTIVATION_CHECK_JOB_NAME}"
          )
          present=0
          for job_name in "${required_jobs[@]}"; do
            if printf '%s' "${jobs_json}" | jq -e --arg name "${job_name}" 'any(.[]; .name == $name)' >/dev/null; then
              present=$((present + 1))
            fi
          done
          if printf '%s' "${apps_json}" | jq -e --arg name "${WEB_APP_NAME}" 'any(.[]; .name == $name)' >/dev/null; then
            present=$((present + 1))
          fi

          if [ "${present}" -eq 8 ]; then
            echo "existing_release=true" >> "$GITHUB_OUTPUT"
            echo "A complete existing release was detected."
          elif [ "${present}" -eq 0 ]; then
            echo "existing_release=false" >> "$GITHUB_OUTPUT"
            echo "No release resources were found -- using the explicit fresh-deploy path."
          else
            echo "Found ${present}/8 deterministic release resources. Partial state is neither a safe current release nor a proven-fresh environment." >&2
            exit 1
          fi

      - name: Resolve the currently-deployed release SHA and image digest
        id: current
        if: steps.detect.outputs.existing_release == 'true'
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          current_sha="$(az containerapp job show \
            --name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].env[?name=='RELEASE_SHA'].value | [0]" \
            --output tsv)"
          current_sha="$(azure_validate_release_sha "${current_sha}")"
          echo "sha=${current_sha}" >> "$GITHUB_OUTPUT"

          current_image="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query "properties.template.containers[0].image" \
            --output tsv)"
          case "${current_image}" in
            *@sha256:*)
              digest_hex="${current_image##*@sha256:}"
              ;;
            *)
              echo "Currently-deployed web app image '${current_image}' is not pinned to an immutable sha256 digest." >&2
              exit 1
              ;;
          esac
          digest="$(azure_validate_image_digest "sha256:${digest_hex}")"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Resolve rollout and evidence values from live deterministic resources
        id: live
        if: steps.detect.outputs.existing_release == 'true'
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          cae_id="$(az containerapp env show \
           --name "${CONTAINER_APPS_ENVIRONMENT_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --query id \
           --output tsv)"
          acr_login_server="$(az acr show \
           --name "${ACR_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --query loginServer \
           --output tsv)"
          runtime_identity_json="$(az identity show \
           --name "${RUNTIME_IDENTITY_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --output json)"
          runtime_identity_id="$(printf '%s' "${runtime_identity_json}" | jq -r '.id // empty')"
          runtime_identity_client_id="$(printf '%s' "${runtime_identity_json}" | jq -r '.clientId // empty')"
          scheduler_identity_id="$(az identity show \
           --name "${SCHEDULER_IDENTITY_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --query id \
           --output tsv)"
          communication_email_sender="$(az containerapp show \
           --name "${WEB_APP_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --query "properties.template.containers[0].env[?name=='AZURE_COMMUNICATION_EMAIL_SENDER'].value | [0]" \
           --output tsv)"
          if [ -z "${communication_email_sender}" ]; then
           echo "The current release predates the ACS sender contract. Refusing to redeclare it with the new rollout template before environment/release provisioning." >&2
           echo "Missing prerequisite: a migration-safe forced-disable helper/template that changes only ROLLOUT_MODE and scheduler trigger state while preserving the current release contract." >&2
           exit 1
          fi
          blob_endpoint="$(az storage account show \
           --name "${EVIDENCE_STORAGE_ACCOUNT_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --query primaryEndpoints.blob \
           --output tsv)"
          evidence_container_url="$(azure_validate_container_url "${blob_endpoint%/}/evidence")"

          for pair in \
           "container_apps_environment_id=${cae_id}" \
           "acr_login_server=${acr_login_server}" \
           "runtime_identity_id=${runtime_identity_id}" \
           "runtime_identity_client_id=${runtime_identity_client_id}" \
           "scheduler_identity_id=${scheduler_identity_id}" \
           "communication_email_sender=${communication_email_sender}" \
           "evidence_container_url=${evidence_container_url}"; do
           if [ -z "${pair#*=}" ]; then
             echo "Required live value '${pair%%=*}' was empty." >&2
             exit 1
           fi
          done
          if ! [[ "${runtime_identity_client_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
           echo "The live runtime identity client ID was not a UUID." >&2
           exit 1
          fi

          {
            echo "container_apps_environment_id=${cae_id}"
            echo "acr_login_server=${acr_login_server}"
            echo "runtime_identity_id=${runtime_identity_id}"
            echo "runtime_identity_client_id=${runtime_identity_client_id}"
            echo "scheduler_identity_id=${scheduler_identity_id}"
            echo "communication_email_sender=${communication_email_sender}"
            echo "evidence_container_url=${evidence_container_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Render rollout.prod.bicepparam from live state (disabled/Manual)
        if: steps.detect.outputs.existing_release == 'true'
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
           --template infra/params/rollout.prod.bicepparam \
           --out /tmp/rollout.prod.force-disabled.bicepparam \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${{ steps.live.outputs.container_apps_environment_id }}" \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${{ steps.live.outputs.acr_login_server }}" \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${{ steps.live.outputs.runtime_identity_id }}" \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityClientId="${{ steps.live.outputs.runtime_identity_client_id }}" \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${{ steps.live.outputs.scheduler_identity_id }}" \
           --set REPLACE_WITH_CURRENTLY_RELEASED_DIGEST="${{ steps.current.outputs.digest }}" \
           --set REPLACE_WITH_REAL_COMMIT_SHA000000000000="${{ steps.current.outputs.sha }}" \
           --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationEmailSender="${{ steps.live.outputs.communication_email_sender }}"
          # Committed rollout.prod.bicepparam already defaults rolloutMode
          # to 'disabled' and both trigger types to 'Manual' -- no
          # --set-string-param override is used here, so this deploy can
          # only ever (re)confirm the disabled/Manual state, never
          # promote it.

      - name: What-if forced disabled/Manual rollout
        if: steps.detect.outputs.existing_release == 'true'
        run: |
          set -euo pipefail
          az deployment group what-if \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --template-file infra/rollout.bicep \
           --parameters /tmp/rollout.prod.force-disabled.bicepparam \
           --result-format FullResourcePayloads \
           --no-pretty-print \
           --output json > /tmp/whatif-rollout-force-disabled.json
          node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-rollout-force-disabled.json

      - name: Force rollout.bicep to disabled/Manual before touching infrastructure
        if: steps.detect.outputs.existing_release == 'true'
        env:
          CURRENT_WEB_DIGEST_HEX: ${{ steps.current.outputs.digest }}
          LIVE_ACR_LOGIN_SERVER: ${{ steps.live.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          az deployment group create \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --name "roll-prod-force-disable-${RESOLVED_SHA}" \
           --template-file infra/rollout.bicep \
           --parameters /tmp/rollout.prod.force-disabled.bicepparam \
           --query properties.outputs \
           --output json > /tmp/rollout-force-disabled-outputs.json
          rollout_mode="$(jq -r '.rolloutMode.value // empty' /tmp/rollout-force-disabled-outputs.json)"
          hourly_trigger="$(jq -r '.hourlyTriggerType.value // empty' /tmp/rollout-force-disabled-outputs.json)"
          daily_trigger="$(jq -r '.dailyTriggerType.value // empty' /tmp/rollout-force-disabled-outputs.json)"
          if [ "${rollout_mode}" != "disabled" ] ||
            [ "${hourly_trigger}" != "Manual" ] ||
            [ "${daily_trigger}" != "Manual" ]; then
           echo "Forced-disable rollout outputs were not disabled/Manual/Manual." >&2
           exit 1
          fi
          web_json="$(az containerapp show \
           --name "${WEB_APP_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --output json)"
          hourly_json="$(az containerapp job show \
           --name "${PROD_HOURLY_JOB_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --output json)"
          daily_json="$(az containerapp job show \
           --name "${PROD_DAILY_JOB_NAME}" \
           --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
           --output json)"
          expected_image="${LIVE_ACR_LOGIN_SERVER}/krypto-web@sha256:${CURRENT_WEB_DIGEST_HEX}"
          printf '%s' "${web_json}" | jq -e --arg image "${expected_image}" \
           '(.properties.template.containers[0].image == $image) and
            (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled"))' >/dev/null
          for job_json in "${hourly_json}" "${daily_json}"; do
           printf '%s' "${job_json}" | jq -e --arg image "${expected_image}" \
             '(.properties.configuration.triggerType == "Manual") and
              ((.properties.configuration.scheduleTriggerConfig // null) == null) and
              (.properties.template.containers[0].image == $image) and
              (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled"))' >/dev/null
          done

      - name: Disable missing-success monitoring after prod jobs are Manual
        if: steps.detect.outputs.existing_release == 'true'
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "mon-pfd-${RESOLVED_SHA:0:12}-${GITHUB_RUN_ID}" \
            --template-file infra/schedule-monitoring.bicep \
            --parameters infra/params/schedule-monitoring.prod.bicepparam \
            --query properties.outputs \
            --output json > /tmp/monitoring-force-disabled-outputs.json
          enabled="$(jq -r '.missingHourlySuccessAlertEnabled.value | tostring' /tmp/monitoring-force-disabled-outputs.json)"
          boundary="$(jq -r '.scheduleEnabledAtUnixSeconds.value // empty' /tmp/monitoring-force-disabled-outputs.json)"
          if [ "${enabled}" != "false" ] || [ "${boundary}" != "0" ]; then
            echo "Forced disable could not disable missing-success monitoring after jobs became Manual." >&2
            exit 1
          fi

  backup-current-release:
    name: Preflight + verified-backup current release before environment.bicep
    needs: [gate, force-disable-rollout]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.force-disable-rollout.result == 'success' &&
      needs.force-disable-rollout.outputs.existing_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
      CURRENT_SHA: ${{ needs.force-disable-rollout.outputs.current_sha }}
      EVIDENCE_CONTAINER_URL: ${{ needs.force-disable-rollout.outputs.evidence_container_url }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Require a full-template Container Apps execution helper
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*--yaml([[:space:]]|$)' .github/scripts/azure/run-ops-job.sh; then
            echo "The current run-ops-job.sh uses an env-only job start override. Azure replaces the execution template when any override is supplied." >&2
            echo "Missing helper: fetch the complete live properties.template, merge JOB_EXECUTION_ID into its env list, and start the execution with az containerapp job start --yaml." >&2
            exit 1
          fi

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run preflight on the current release
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id preflight)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation preflight \
            --job-execution-id "${job_execution_id}" \
            --destination evidence-current
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence-current/prod/${CURRENT_SHA}/preflight/${job_execution_id}/report.json" \
            --operation preflight \
            --release-sha "${CURRENT_SHA}"

      - name: Run verified-backup on the current release
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id verified-backup current)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${VERIFIED_BACKUP_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${CURRENT_SHA}" \
            --operation verified-backup \
            --job-execution-id "${job_execution_id}" \
            --destination evidence-current
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence-current/prod/${CURRENT_SHA}/verified-backup/${job_execution_id}/report.json" \
            --operation verified-backup \
            --release-sha "${CURRENT_SHA}"

      - name: Publish current-release safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deploy-prod-current-release-evidence-${{ needs.gate.outputs.sha }}
          path: evidence-current/
          if-no-files-found: warn
          retention-days: 90

  deploy-environment:
    name: Deploy infra/environment.bicep (prod, after current-release safety)
    needs: [gate, force-disable-rollout, backup-current-release]
    # A skipped backup is accepted only for the explicitly proven-fresh
    # path. Any partial/failed current-release safety path blocks all
    # infrastructure mutation, including PostgreSQL credential rotation.
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.force-disable-rollout.result == 'success' &&
      ((needs.force-disable-rollout.outputs.existing_release == 'false' &&
        needs.backup-current-release.result == 'skipped') ||
       (needs.force-disable-rollout.outputs.existing_release == 'true' &&
        needs.backup-current-release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
    outputs:
      acr_name: ${{ steps.outputs.outputs.acr_name }}
      acr_login_server: ${{ steps.outputs.outputs.acr_login_server }}
      container_apps_environment_id: ${{ steps.outputs.outputs.container_apps_environment_id }}
      runtime_identity_id: ${{ steps.outputs.outputs.runtime_identity_id }}
      runtime_identity_client_id: ${{ steps.outputs.outputs.runtime_identity_client_id }}
      runtime_identity_principal_id: ${{ steps.outputs.outputs.runtime_identity_principal_id }}
      scheduler_identity_id: ${{ steps.outputs.outputs.scheduler_identity_id }}
      scheduler_identity_client_id: ${{ steps.outputs.outputs.scheduler_identity_client_id }}
      scheduler_identity_principal_id: ${{ steps.outputs.outputs.scheduler_identity_principal_id }}
      ops_identity_id: ${{ steps.outputs.outputs.ops_identity_id }}
      ops_identity_principal_id: ${{ steps.outputs.outputs.ops_identity_principal_id }}
      ops_identity_client_id: ${{ steps.outputs.outputs.ops_identity_client_id }}
      evidence_storage_account_name: ${{ steps.outputs.outputs.evidence_storage_account_name }}
      evidence_container_name: ${{ steps.outputs.outputs.evidence_container_name }}
      evidence_container_url: ${{ steps.outputs.outputs.evidence_container_url }}
      evidence_immutability_retention_days: ${{ steps.outputs.outputs.evidence_immutability_retention_days }}
      communication_service_name: ${{ steps.outputs.outputs.communication_service_name }}
      communication_email_sender: ${{ steps.outputs.outputs.communication_email_sender }}
      log_analytics_workspace_id: ${{ steps.outputs.outputs.log_analytics_workspace_id }}
      action_group_id: ${{ steps.outputs.outputs.action_group_id }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require registered Azure providers
        run: .github/scripts/azure/register-providers.sh --check-only

      - name: Resolve the prod-deploy OIDC identity's principal ID
        id: identity
        run: |
          set -euo pipefail
          principal_id="$(az identity show \
            --name "${{ vars.PROD_DEPLOY_IDENTITY_NAME }}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query principalId \
            --output tsv)"
          if [ -z "${principal_id}" ]; then
            echo "Could not resolve a principal ID for identity '${{ vars.PROD_DEPLOY_IDENTITY_NAME }}'." >&2
            exit 1
          fi
          echo "::add-mask::${principal_id}"
          echo "principal_id=${principal_id}" >> "$GITHUB_OUTPUT"

      - name: Resolve the prod-promotion OIDC identity's principal ID
        id: identity_promotion
        run: |
          set -euo pipefail
          principal_id="$(az identity show \
            --name "${{ vars.PROD_PROMOTION_IDENTITY_NAME }}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --query principalId \
            --output tsv)"
          if [ -z "${principal_id}" ]; then
            echo "Could not resolve a principal ID for identity '${{ vars.PROD_PROMOTION_IDENTITY_NAME }}'." >&2
            exit 1
          fi
          echo "::add-mask::${principal_id}"
          echo "principal_id=${principal_id}" >> "$GITHUB_OUTPUT"

      - name: Render environment.prod.bicepparam
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/environment.prod.bicepparam \
            --out /tmp/environment.prod.resolved.bicepparam \
            --set REPLACE_WITH_BOOTSTRAP_PROD_DEPLOY_IDENTITY_PRINCIPAL_ID="${{ steps.identity.outputs.principal_id }}" \
            --set REPLACE_WITH_BOOTSTRAP_PROD_PROMOTION_IDENTITY_PRINCIPAL_ID="${{ steps.identity_promotion.outputs.principal_id }}"

      - name: What-if infra/environment.bicep
        env:
          POSTGRES_ADMIN_PASSWORD_PROD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/environment.bicep \
            --parameters /tmp/environment.prod.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-environment.json

      - name: Reject unsafe what-if deletes (PostgreSQL, Key Vault, evidence storage, locks)
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-environment.json

      - name: Reverify current release safety immediately before infrastructure mutation
        if: needs.force-disable-rollout.outputs.existing_release == 'true'
        env:
          EXPECTED_CURRENT_SHA: ${{ needs.force-disable-rollout.outputs.current_sha }}
          EXPECTED_CURRENT_DIGEST_HEX: ${{ needs.force-disable-rollout.outputs.current_digest }}
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          expected_sha="$(azure_validate_release_sha "${EXPECTED_CURRENT_SHA}")"
          expected_digest="$(azure_validate_image_digest "sha256:${EXPECTED_CURRENT_DIGEST_HEX}")"
          web_json="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          preflight_json="$(az containerapp job show \
            --name "${PREFLIGHT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          hourly_json="$(az containerapp job show \
            --name "${PROD_HOURLY_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          daily_json="$(az containerapp job show \
            --name "${PROD_DAILY_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          printf '%s' "${web_json}" | jq -e --arg digest "@${expected_digest}" \
            '(.properties.template.containers[0].image | endswith($digest)) and
             (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled"))' >/dev/null
          printf '%s' "${preflight_json}" | jq -e --arg sha "${expected_sha}" \
            'any(.properties.template.containers[0].env[]?; .name == "RELEASE_SHA" and .value == $sha)' >/dev/null
          for job_json in "${hourly_json}" "${daily_json}"; do
            printf '%s' "${job_json}" | jq -e \
              '(.properties.configuration.triggerType == "Manual") and
               ((.properties.configuration.scheduleTriggerConfig // null) == null) and
               (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled"))' >/dev/null
          done

      - name: Deploy infra/environment.bicep
        env:
          POSTGRES_ADMIN_PASSWORD_PROD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "env-prod-${RESOLVED_SHA}" \
            --template-file infra/environment.bicep \
            --parameters /tmp/environment.prod.resolved.bicepparam \
            --query properties.outputs \
            --output json > /tmp/environment-outputs.json
          cat /tmp/environment-outputs.json

      - name: Extract environment.bicep outputs
        id: outputs
        run: |
          set -euo pipefail
          for name in \
            acrName \
            acrLoginServer \
            containerAppsEnvironmentId \
            runtimeIdentityId \
            runtimeIdentityClientId \
            runtimeIdentityPrincipalId \
            schedulerIdentityId \
            schedulerIdentityClientId \
            schedulerIdentityPrincipalId \
            opsIdentityId \
            opsIdentityPrincipalId \
            opsIdentityClientId \
            evidenceStorageAccountName \
            evidenceContainerName \
            evidenceContainerUrl \
            evidenceImmutabilityRetentionDays \
            communicationServiceName \
            communicationEmailSender \
            logAnalyticsWorkspaceId \
            actionGroupId; do
            value="$(jq -r --arg n "${name}" '.[$n].value // empty' /tmp/environment-outputs.json)"
            if [ -z "${value}" ]; then
              echo "Deployment output '${name}' was missing or empty -- failing closed." >&2
              exit 1
            fi
            snake="$(printf '%s' "${name}" | sed -E 's/([A-Z])/_\1/g' | tr '[:upper:]' '[:lower:]')"
            echo "${snake}=${value}" >> "$GITHUB_OUTPUT"
          done

      - name: Create the nonsecret foundation handoff
        env:
          DEPLOYMENT_STAGE: ${{ needs.gate.outputs.deployment_stage }}
          RUNTIME_IDENTITY_ID: ${{ steps.outputs.outputs.runtime_identity_id }}
          RUNTIME_IDENTITY_CLIENT_ID: ${{ steps.outputs.outputs.runtime_identity_client_id }}
          RUNTIME_IDENTITY_PRINCIPAL_ID: ${{ steps.outputs.outputs.runtime_identity_principal_id }}
          SCHEDULER_IDENTITY_ID: ${{ steps.outputs.outputs.scheduler_identity_id }}
          SCHEDULER_IDENTITY_CLIENT_ID: ${{ steps.outputs.outputs.scheduler_identity_client_id }}
          SCHEDULER_IDENTITY_PRINCIPAL_ID: ${{ steps.outputs.outputs.scheduler_identity_principal_id }}
          OPS_IDENTITY_ID: ${{ steps.outputs.outputs.ops_identity_id }}
          OPS_IDENTITY_CLIENT_ID: ${{ steps.outputs.outputs.ops_identity_client_id }}
          OPS_IDENTITY_PRINCIPAL_ID: ${{ steps.outputs.outputs.ops_identity_principal_id }}
          EVIDENCE_STORAGE_ACCOUNT_NAME: ${{ steps.outputs.outputs.evidence_storage_account_name }}
          EVIDENCE_CONTAINER_NAME: ${{ steps.outputs.outputs.evidence_container_name }}
          EVIDENCE_CONTAINER_URL: ${{ steps.outputs.outputs.evidence_container_url }}
          EVIDENCE_IMMUTABILITY_RETENTION_DAYS: ${{ steps.outputs.outputs.evidence_immutability_retention_days }}
          COMMUNICATION_SERVICE_NAME: ${{ steps.outputs.outputs.communication_service_name }}
          COMMUNICATION_EMAIL_SENDER: ${{ steps.outputs.outputs.communication_email_sender }}
          LOG_ANALYTICS_WORKSPACE_ID: ${{ steps.outputs.outputs.log_analytics_workspace_id }}
          ACTION_GROUP_ID: ${{ steps.outputs.outputs.action_group_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment prod \
            --arg deploymentStage "${DEPLOYMENT_STAGE}" \
            --arg releaseSha "${RESOLVED_SHA}" \
            --arg runtimeIdentityId "${RUNTIME_IDENTITY_ID}" \
            --arg runtimeIdentityClientId "${RUNTIME_IDENTITY_CLIENT_ID}" \
            --arg runtimeIdentityPrincipalId "${RUNTIME_IDENTITY_PRINCIPAL_ID}" \
            --arg schedulerIdentityId "${SCHEDULER_IDENTITY_ID}" \
            --arg schedulerIdentityClientId "${SCHEDULER_IDENTITY_CLIENT_ID}" \
            --arg schedulerIdentityPrincipalId "${SCHEDULER_IDENTITY_PRINCIPAL_ID}" \
            --arg opsIdentityId "${OPS_IDENTITY_ID}" \
            --arg opsIdentityClientId "${OPS_IDENTITY_CLIENT_ID}" \
            --arg opsIdentityPrincipalId "${OPS_IDENTITY_PRINCIPAL_ID}" \
            --arg evidenceStorageAccountName "${EVIDENCE_STORAGE_ACCOUNT_NAME}" \
            --arg evidenceContainerName "${EVIDENCE_CONTAINER_NAME}" \
            --arg evidenceContainerUrl "${EVIDENCE_CONTAINER_URL}" \
            --arg evidenceImmutabilityRetentionDays "${EVIDENCE_IMMUTABILITY_RETENTION_DAYS}" \
            --arg communicationServiceName "${COMMUNICATION_SERVICE_NAME}" \
            --arg communicationEmailSender "${COMMUNICATION_EMAIL_SENDER}" \
            --arg logAnalyticsWorkspaceId "${LOG_ANALYTICS_WORKSPACE_ID}" \
            --arg actionGroupId "${ACTION_GROUP_ID}" \
            '{
              schemaVersion: "1.0.0",
              environment: $environment,
              deploymentStage: $deploymentStage,
              releaseSha: $releaseSha,
              identities: {
                runtime: {resourceId: $runtimeIdentityId, clientId: $runtimeIdentityClientId, principalId: $runtimeIdentityPrincipalId},
                scheduler: {resourceId: $schedulerIdentityId, clientId: $schedulerIdentityClientId, principalId: $schedulerIdentityPrincipalId},
                ops: {resourceId: $opsIdentityId, clientId: $opsIdentityClientId, principalId: $opsIdentityPrincipalId}
              },
              evidence: {
                storageAccountName: $evidenceStorageAccountName,
                containerName: $evidenceContainerName,
                containerUrl: $evidenceContainerUrl,
                immutabilityRetentionDays: ($evidenceImmutabilityRetentionDays | tonumber)
              },
              communication: {
                serviceName: $communicationServiceName,
                emailSender: $communicationEmailSender
              },
              monitoring: {
                logAnalyticsWorkspaceId: $logAnalyticsWorkspaceId,
                actionGroupId: $actionGroupId
              }
            }' > foundation-outputs.prod.json
          {
            echo "### Prod environment foundation outputs"
            echo ""
            echo "Use the runtime/ops principal IDs in the separately protected Foundry workload-access workflow."
            echo '```json'
            jq . foundation-outputs.prod.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish environment foundation outputs
        uses: actions/upload-artifact@v4
        with:
          name: azure-deploy-prod-foundation-${{ needs.gate.outputs.sha }}
          path: foundation-outputs.prod.json
          if-no-files-found: error
          retention-days: 90

  build-images:
    name: Build web/ops images and resolve digests (prod)
    needs: [gate, deploy-environment]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.deploy-environment.result == 'success' &&
      needs.gate.outputs.deployment_stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
      ACR_NAME: ${{ needs.deploy-environment.outputs.acr_name }}
    outputs:
      web_digest_hex: ${{ steps.web.outputs.digest_hex }}
      ops_digest_hex: ${{ steps.ops.outputs.digest_hex }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build web image and resolve digest
        id: web
        run: |
          set -euo pipefail
          out="$(.github/scripts/azure/build-and-resolve-digest.sh \
            --registry "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --repository krypto-web \
            --target web \
            --tag "${RESOLVED_SHA}")"
          echo "${out}"
          digest="$(printf '%s' "${out}" | grep '^digest=' | cut -d= -f2)"
          echo "digest_hex=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Build ops image and resolve digest
        id: ops
        run: |
          set -euo pipefail
          out="$(.github/scripts/azure/build-and-resolve-digest.sh \
            --registry "${ACR_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --repository krypto-ops \
            --target ops \
            --tag "${RESOLVED_SHA}")"
          echo "${out}"
          digest="$(printf '%s' "${out}" | grep '^digest=' | cut -d= -f2)"
          echo "digest_hex=${digest#sha256:}" >> "$GITHUB_OUTPUT"

  deploy-release:
    name: Deploy infra/release.bicep (prod, disabled/Manual)
    needs:
      [
        gate,
        deploy-environment,
        build-images,
        force-disable-rollout,
        backup-current-release,
      ]
    # backup-current-release is skipped only on the proven-fresh path.
    # Explicit result/stage checks keep foundation green while ensuring a
    # skipped/failed safety job cannot accidentally admit a full deploy.
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.deploy-environment.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.force-disable-rollout.result == 'success' &&
      needs.gate.outputs.deployment_stage == 'full' &&
      ((needs.force-disable-rollout.outputs.existing_release == 'false' &&
        needs.backup-current-release.result == 'skipped') ||
       (needs.force-disable-rollout.outputs.existing_release == 'true' &&
        needs.backup-current-release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
    outputs:
      migrate_init_job_name: ${{ steps.outputs.outputs.migrate_init_job_name }}
      preflight_job_name: ${{ steps.outputs.outputs.preflight_job_name }}
      verified_backup_job_name: ${{ steps.outputs.outputs.verified_backup_job_name }}
      target_smoke_job_name: ${{ steps.outputs.outputs.target_smoke_job_name }}
      activation_check_job_name: ${{ steps.outputs.outputs.activation_check_job_name }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Render release.prod.bicepparam
        env:
          ENV_CONTAINER_APPS_ENVIRONMENT_ID: ${{ needs.deploy-environment.outputs.container_apps_environment_id }}
          ENV_ACR_LOGIN_SERVER: ${{ needs.deploy-environment.outputs.acr_login_server }}
          ENV_RUNTIME_IDENTITY_ID: ${{ needs.deploy-environment.outputs.runtime_identity_id }}
          ENV_RUNTIME_IDENTITY_CLIENT_ID: ${{ needs.deploy-environment.outputs.runtime_identity_client_id }}
          ENV_RUNTIME_IDENTITY_PRINCIPAL_ID: ${{ needs.deploy-environment.outputs.runtime_identity_principal_id }}
          ENV_SCHEDULER_IDENTITY_ID: ${{ needs.deploy-environment.outputs.scheduler_identity_id }}
          ENV_SCHEDULER_IDENTITY_PRINCIPAL_ID: ${{ needs.deploy-environment.outputs.scheduler_identity_principal_id }}
          ENV_OPS_IDENTITY_ID: ${{ needs.deploy-environment.outputs.ops_identity_id }}
          ENV_OPS_IDENTITY_PRINCIPAL_ID: ${{ needs.deploy-environment.outputs.ops_identity_principal_id }}
          ENV_OPS_IDENTITY_CLIENT_ID: ${{ needs.deploy-environment.outputs.ops_identity_client_id }}
          ENV_EVIDENCE_CONTAINER_URL: ${{ needs.deploy-environment.outputs.evidence_container_url }}
          ENV_COMMUNICATION_SERVICE_NAME: ${{ needs.deploy-environment.outputs.communication_service_name }}
          ENV_COMMUNICATION_EMAIL_SENDER: ${{ needs.deploy-environment.outputs.communication_email_sender }}
          BUILD_WEB_DIGEST_HEX: ${{ needs.build-images.outputs.web_digest_hex }}
          BUILD_OPS_DIGEST_HEX: ${{ needs.build-images.outputs.ops_digest_hex }}
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/release.prod.bicepparam \
            --out /tmp/release.prod.resolved.bicepparam \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_containerAppsEnvironmentId="${ENV_CONTAINER_APPS_ENVIRONMENT_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_acrLoginServer="${ENV_ACR_LOGIN_SERVER}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityId="${ENV_RUNTIME_IDENTITY_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityClientId="${ENV_RUNTIME_IDENTITY_CLIENT_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_runtimeIdentityPrincipalId="${ENV_RUNTIME_IDENTITY_PRINCIPAL_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityId="${ENV_SCHEDULER_IDENTITY_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_schedulerIdentityPrincipalId="${ENV_SCHEDULER_IDENTITY_PRINCIPAL_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityId="${ENV_OPS_IDENTITY_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityPrincipalId="${ENV_OPS_IDENTITY_PRINCIPAL_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_opsIdentityClientId="${ENV_OPS_IDENTITY_CLIENT_ID}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_evidenceContainerUrl="${ENV_EVIDENCE_CONTAINER_URL}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationServiceName="${ENV_COMMUNICATION_SERVICE_NAME}" \
            --set REPLACE_WITH_ENVIRONMENT_OUTPUT_communicationEmailSender="${ENV_COMMUNICATION_EMAIL_SENDER}" \
            --set REPLACE_WITH_PUSHED_WEB_DIGEST="${BUILD_WEB_DIGEST_HEX}" \
            --set REPLACE_WITH_PUSHED_OPS_DIGEST="${BUILD_OPS_DIGEST_HEX}" \
            --set REPLACE_WITH_REAL_COMMIT_SHA000000000000="${RESOLVED_SHA}"

      - name: What-if infra/release.bicep
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_PROD: ${{ secrets.DIRECT_URL }}
          MIGRATION_URL_PROD: ${{ secrets.MIGRATION_URL }}
          CRON_SECRET_PROD: ${{ secrets.CRON_SECRET }}
          POSTHOG_API_KEY_PROD: ${{ secrets.POSTHOG_API_KEY }}
          ADMIN_PASSWORD_PROD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET_PROD: ${{ secrets.ADMIN_SESSION_SECRET }}
          RUNTIME_DATABASE_PASSWORD_PROD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          MIGRATOR_DATABASE_PASSWORD_PROD: ${{ secrets.MIGRATOR_DATABASE_PASSWORD }}
          DEPLOYMENT_APPROVAL_SECRET_PROD: ${{ secrets.DEPLOYMENT_APPROVAL_SECRET }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --template-file infra/release.bicep \
            --parameters /tmp/release.prod.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-release.json

      - name: Reject unsafe what-if deletes
        run: node .github/scripts/azure/reject-unsafe-whatif-deletes.mjs --file /tmp/whatif-release.json

      - name: Deploy infra/release.bicep
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_PROD: ${{ secrets.DIRECT_URL }}
          MIGRATION_URL_PROD: ${{ secrets.MIGRATION_URL }}
          CRON_SECRET_PROD: ${{ secrets.CRON_SECRET }}
          POSTHOG_API_KEY_PROD: ${{ secrets.POSTHOG_API_KEY }}
          ADMIN_PASSWORD_PROD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET_PROD: ${{ secrets.ADMIN_SESSION_SECRET }}
          RUNTIME_DATABASE_PASSWORD_PROD: ${{ secrets.RUNTIME_DATABASE_PASSWORD }}
          MIGRATOR_DATABASE_PASSWORD_PROD: ${{ secrets.MIGRATOR_DATABASE_PASSWORD }}
          DEPLOYMENT_APPROVAL_SECRET_PROD: ${{ secrets.DEPLOYMENT_APPROVAL_SECRET }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --name "rel-prod-${RESOLVED_SHA}" \
            --template-file infra/release.bicep \
            --parameters /tmp/release.prod.resolved.bicepparam \
            --query properties.outputs \
            --output json > /tmp/release-outputs.json
          cat /tmp/release-outputs.json

      - name: Extract release.bicep job name outputs
        id: outputs
        run: |
          set -euo pipefail
          for name in migrateInitJobName preflightJobName verifiedBackupJobName targetSmokeJobName activationCheckJobName; do
            value="$(jq -r --arg n "${name}" '.[$n].value // empty' /tmp/release-outputs.json)"
            if [ -z "${value}" ]; then
              echo "Deployment output '${name}' was missing or empty -- failing closed." >&2
              exit 1
            fi
            snake="$(printf '%s' "${name}" | sed -E 's/([A-Z])/_\1/g' | tr '[:upper:]' '[:lower:]')"
            echo "${snake}=${value}" >> "$GITHUB_OUTPUT"
          done

  migrate-backup-smoke:
    name: migrate-init -> baseline verified-backup -> target-smoke (new release)
    needs: [gate, deploy-environment, deploy-release, build-images]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.deploy-environment.result == 'success' &&
      needs.deploy-release.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.gate.outputs.deployment_stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
      EVIDENCE_CONTAINER_URL: ${{ needs.deploy-environment.outputs.evidence_container_url }}
      MIGRATE_INIT_JOB_NAME: ${{ needs.deploy-release.outputs.migrate_init_job_name }}
      VERIFIED_BACKUP_JOB_NAME_NEW: ${{ needs.deploy-release.outputs.verified_backup_job_name }}
      TARGET_SMOKE_JOB_NAME_NEW: ${{ needs.deploy-release.outputs.target_smoke_job_name }}
      WEB_DIGEST_HEX: ${{ needs.build-images.outputs.web_digest_hex }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Require a full-template Container Apps execution helper
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*--yaml([[:space:]]|$)' .github/scripts/azure/run-ops-job.sh; then
            echo "The current run-ops-job.sh uses an env-only job start override. Azure replaces the execution template when any override is supplied." >&2
            echo "Missing helper: fetch the complete live properties.template, merge JOB_EXECUTION_ID into its env list, and start the execution with az containerapp job start --yaml." >&2
            exit 1
          fi

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run migrate-init (new release)
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id migrate-init)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${MIGRATE_INIT_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RESOLVED_SHA}" \
            --operation migrate-init \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RESOLVED_SHA}/migrate-init/${job_execution_id}/report.json" \
            --operation migrate-init \
            --release-sha "${RESOLVED_SHA}"

      - name: Create and restore-verify a fresh baseline backup (new release)
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id verified-backup)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${VERIFIED_BACKUP_JOB_NAME_NEW}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RESOLVED_SHA}" \
            --operation verified-backup \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RESOLVED_SHA}/verified-backup/${job_execution_id}/report.json" \
            --operation verified-backup \
            --release-sha "${RESOLVED_SHA}"

      - name: Run target-smoke (new release)
        id: target_smoke
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          job_execution_id="$(azure_new_job_execution_id target-smoke)"
          .github/scripts/azure/run-ops-job.sh \
            --job-name "${TARGET_SMOKE_JOB_NAME_NEW}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --job-execution-id "${job_execution_id}" \
            --timeout-seconds "${OPS_JOB_TIMEOUT_SECONDS}"
          .github/scripts/azure/download-evidence.sh \
            --container-url "${EVIDENCE_CONTAINER_URL}" \
            --environment-name prod \
            --release-sha "${RESOLVED_SHA}" \
            --operation target-smoke \
            --job-execution-id "${job_execution_id}" \
            --destination evidence
          node .github/scripts/azure/validate-report.mjs \
            --report "evidence/prod/${RESOLVED_SHA}/target-smoke/${job_execution_id}/report.json" \
            --operation target-smoke \
            --release-sha "${RESOLVED_SHA}" \
            --image-digest "sha256:${WEB_DIGEST_HEX}"
          echo "job_execution_id=${job_execution_id}" >> "$GITHUB_OUTPUT"

      - name: Surface retained target-smoke evidence
        env:
          TARGET_SMOKE_EXECUTION_ID: ${{ steps.target_smoke.outputs.job_execution_id }}
        run: |
          set -euo pipefail
          {
            echo "### retained target-smoke evidence"
            echo ""
            echo "- release SHA: \`${RESOLVED_SHA}\`"
            echo "- image digest: \`sha256:${WEB_DIGEST_HEX}\`"
            echo "- target_smoke_execution_id: \`${TARGET_SMOKE_EXECUTION_ID}\`"
            echo ""
            echo "No production promotion workflow is shipped or approved. Preserve this exact evidence ID for any future independently reviewed promotion design."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish downloaded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deploy-prod-evidence-${{ needs.gate.outputs.sha }}-${{ steps.target_smoke.outputs.job_execution_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Confirm this workflow ends disabled/Manual
        run: |
          echo "release.bicep hardcodes ROLLOUT_MODE=disabled and triggerType=Manual regardless of parameters."
          echo "No executable production shadow/paper promotion workflow is shipped."

  verify-final-state:
    name: Verify live prod disabled/Manual, no schedule, and exact SHA/digests
    needs:
      [
        gate,
        deploy-environment,
        deploy-release,
        build-images,
        migrate-backup-smoke,
      ]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.deploy-environment.result == 'success' &&
      needs.deploy-release.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.migrate-backup-smoke.result == 'success' &&
      needs.gate.outputs.deployment_stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
      ACR_NAME_DEPLOYED: ${{ needs.deploy-environment.outputs.acr_name }}
      ACR_LOGIN_SERVER: ${{ needs.deploy-environment.outputs.acr_login_server }}
      WEB_DIGEST_HEX: ${{ needs.build-images.outputs.web_digest_hex }}
      OPS_DIGEST_HEX: ${{ needs.build-images.outputs.ops_digest_hex }}
      MIGRATE_INIT_JOB_NAME_DEPLOYED: ${{ needs.deploy-release.outputs.migrate_init_job_name }}
      PREFLIGHT_JOB_NAME_DEPLOYED: ${{ needs.deploy-release.outputs.preflight_job_name }}
      VERIFIED_BACKUP_JOB_NAME_DEPLOYED: ${{ needs.deploy-release.outputs.verified_backup_job_name }}
      TARGET_SMOKE_JOB_NAME_DEPLOYED: ${{ needs.deploy-release.outputs.target_smoke_job_name }}
      ACTIVATION_CHECK_JOB_NAME_DEPLOYED: ${{ needs.deploy-release.outputs.activation_check_job_name }}
      EXPECTED_RUNTIME_CLIENT_ID: ${{ needs.deploy-environment.outputs.runtime_identity_client_id }}
      EXPECTED_COMMUNICATION_EMAIL_SENDER: ${{ needs.deploy-environment.outputs.communication_email_sender }}
    steps:
      - name: Checkout ${{ needs.gate.outputs.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Verify live production-deploy approval authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/azure/verify-github-environment-protection.sh --environment production-deploy

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the live disabled release and immutable image binding
        run: |
          set -euo pipefail
          source .github/scripts/azure/lib/common.sh
          release_sha="$(azure_validate_release_sha "${RESOLVED_SHA}")"
          web_digest="$(azure_validate_image_digest "sha256:${WEB_DIGEST_HEX}")"
          ops_digest="$(azure_validate_image_digest "sha256:${OPS_DIGEST_HEX}")"
          expected_web_image="${ACR_LOGIN_SERVER}/krypto-web@${web_digest}"
          expected_ops_image="${ACR_LOGIN_SERVER}/krypto-ops@${ops_digest}"

          web_json="$(az containerapp show \
            --name "${WEB_APP_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          hourly_json="$(az containerapp job show \
            --name "${PROD_HOURLY_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"
          daily_json="$(az containerapp job show \
            --name "${PROD_DAILY_JOB_NAME}" \
            --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
            --output json)"

          printf '%s' "${web_json}" | jq -e \
            --arg image "${expected_web_image}" \
            --arg client_id "${EXPECTED_RUNTIME_CLIENT_ID}" \
            --arg sender "${EXPECTED_COMMUNICATION_EMAIL_SENDER}" \
            '(.properties.template.containers[0].image == $image) and
             (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled")) and
             (any(.properties.template.containers[0].env[]?; .name == "AZURE_CLIENT_ID" and .value == $client_id)) and
             (any(.properties.template.containers[0].env[]?; .name == "AZURE_COMMUNICATION_EMAIL_SENDER" and .value == $sender))' >/dev/null
          for job_json in "${hourly_json}" "${daily_json}"; do
            printf '%s' "${job_json}" | jq -e \
              --arg image "${expected_web_image}" \
              '(.properties.configuration.triggerType == "Manual") and
               ((.properties.configuration.scheduleTriggerConfig // null) == null) and
               (.properties.template.containers[0].image == $image) and
               (any(.properties.template.containers[0].env[]?; .name == "ROLLOUT_MODE" and .value == "disabled"))' >/dev/null
          done
          for ops_job_name in \
            "${MIGRATE_INIT_JOB_NAME_DEPLOYED}" \
            "${PREFLIGHT_JOB_NAME_DEPLOYED}" \
            "${VERIFIED_BACKUP_JOB_NAME_DEPLOYED}" \
            "${TARGET_SMOKE_JOB_NAME_DEPLOYED}" \
            "${ACTIVATION_CHECK_JOB_NAME_DEPLOYED}"; do
            ops_json="$(az containerapp job show \
              --name "${ops_job_name}" \
              --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
              --output json)"
            printf '%s' "${ops_json}" | jq -e \
              --arg image "${expected_ops_image}" \
              --arg sha "${release_sha}" \
              '(.properties.configuration.triggerType == "Manual") and
               ((.properties.configuration.scheduleTriggerConfig // null) == null) and
               (.properties.template.containers[0].image == $image) and
               (any(.properties.template.containers[0].env[]?; .name == "RELEASE_SHA" and .value == $sha))' >/dev/null
          done
          for digest_bound_job_name in "${TARGET_SMOKE_JOB_NAME_DEPLOYED}" "${ACTIVATION_CHECK_JOB_NAME_DEPLOYED}"; do
            digest_bound_json="$(az containerapp job show \
              --name "${digest_bound_job_name}" \
              --resource-group "${PROD_RESOURCE_GROUP_NAME}" \
              --output json)"
            printf '%s' "${digest_bound_json}" | jq -e --arg digest "${web_digest}" \
              'any(.properties.template.containers[0].env[]?; .name == "IMAGE_DIGEST" and .value == $digest)' >/dev/null
          done

          web_tag_digest="$(az acr repository show \
            --name "${ACR_NAME_DEPLOYED}" \
            --image "krypto-web:${release_sha}" \
            --query digest \
            --output tsv)"
          ops_tag_digest="$(az acr repository show \
            --name "${ACR_NAME_DEPLOYED}" \
            --image "krypto-ops:${release_sha}" \
            --query digest \
            --output tsv)"
          if [ "${web_tag_digest}" != "${web_digest}" ] || [ "${ops_tag_digest}" != "${ops_digest}" ]; then
            echo "The commit-SHA image tags no longer resolve to the exact deployed immutable digests." >&2
            exit 1
          fi
          echo "Verified live prod state: disabled, both scheduler jobs Manual with no schedule, release ${release_sha}, web ${web_digest}, ops ${ops_digest}."
