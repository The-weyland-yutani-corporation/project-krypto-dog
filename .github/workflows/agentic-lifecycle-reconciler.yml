name: Agentic Lifecycle Reconciler

# Deterministic issue/session/PR/deployment lifecycle reconciler for the
# safety-bounded autonomous SDLC factory (specs/factory.md).
# This workflow never executes issue/PR-authored code: it only checks out
# the trusted reconciler implementation from the exact default branch and
# reads/writes issue, PR, check, and deployment state through the GitHub
# API. `pull_request_target` is used deliberately (never `pull_request`) so
# that untrusted PR heads are never checked out or built, and the checkout
# step below is pinned to the default branch with a sparse `.github/scripts`
# checkout and no persisted credentials.
#
# Deliberately no `status` trigger: `azure-deploy-dev.yml` publishes the
# `Dev deployment evidence` commit status (and the `development` GitHub
# Deployment) itself before that workflow run completes, so a `status`
# event would fire on every ordinary commit status across the repo -- a
# high-volume storm for a signal this reconciler doesn't need a dedicated
# trigger for. Development and production completion plus the conservative
# schedule pick up immutable deployment evidence without that volume.

on:
  workflow_dispatch: {}
  schedule:
    # Conservative cadence: every 15 minutes.
    - cron: "*/15 * * * *"
  issues:
    types: [assigned, unassigned, labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed, labeled, unlabeled]
  workflow_run:
    workflows: ["Azure deploy dev", "Azure deploy prod"]
    types: [completed]

concurrency:
  # A single global group so reconciliation passes always serialize; this is
  # required for the exactly-one-lifecycle-label and exactly-one-open-PR
  # invariants to stay race-free. Never cancel an in-flight pass: doing so
  # could interrupt a partially-applied label/comment mutation.
  group: agentic-lifecycle-reconciler
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  # One ledger-bound retry of a verified mutation-free production deferral.
  actions: write
  deployments: read
  statuses: read

jobs:
  reconcile:
    name: Reconcile factory issue/PR/paper-production lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted reconciler implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/agentic-policy.json

      - name: Reconcile factory lifecycle
        uses: actions/github-script@v9
        env:
          FACTORY_ASSIGNMENT_ACTOR_NODE_ID: ${{ vars.FACTORY_ASSIGNMENT_ACTOR_NODE_ID }}
        with:
          script: |
            const path = require("node:path");
            const reconcilerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/scripts/agentic-lifecycle-reconciler.cjs",
            );
            const { reconcileFactoryLifecycle } = require(reconcilerPath);
            await reconcileFactoryLifecycle({
              autonomous: require(path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/agentic-policy.cjs")).AGENTIC_POLICY.autonomy.enabled,
              github,
              context,
              core,
              assignmentActorNodeId:
                process.env.FACTORY_ASSIGNMENT_ACTOR_NODE_ID,
            });
