name: Azure platform workload access

# One-time or identity-rotation binding of dev/prod runtime and ops identities
# to the dedicated Foundry account. Principal IDs come only from retained
# environment.bicep outputs and are format-validated before Azure login.
on:
  workflow_dispatch:
    inputs:
      dev_runtime_principal_id:
        description: Dev runtime identity principal ID from environment.bicep.
        required: true
        type: string
      dev_ops_principal_id:
        description: Dev ops identity principal ID from environment.bicep.
        required: true
        type: string
      prod_runtime_principal_id:
        description: Prod runtime identity principal ID from environment.bicep.
        required: true
        type: string
      prod_ops_principal_id:
        description: Prod ops identity principal ID from environment.bicep.
        required: true
        type: string

concurrency:
  group: azure-platform-workload-access
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLATFORM_RESOURCE_GROUP_NAME: ${{ vars.PLATFORM_RESOURCE_GROUP_NAME }}
  FOUNDRY_RESOURCE_NAME: ${{ vars.FOUNDRY_RESOURCE_NAME }}
  DEV_RUNTIME_PRINCIPAL_ID: ${{ inputs.dev_runtime_principal_id }}
  DEV_OPS_PRINCIPAL_ID: ${{ inputs.dev_ops_principal_id }}
  PROD_RUNTIME_PRINCIPAL_ID: ${{ inputs.prod_runtime_principal_id }}
  PROD_OPS_PRINCIPAL_ID: ${{ inputs.prod_ops_principal_id }}

jobs:
  plan:
    name: Plan Foundry workload access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate principal IDs
        run: |
          set -euo pipefail
          for name in DEV_RUNTIME_PRINCIPAL_ID DEV_OPS_PRINCIPAL_ID PROD_RUNTIME_PRINCIPAL_ID PROD_OPS_PRINCIPAL_ID; do
            value="${!name}"
            if ! [[ "${value}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "${name} is not a UUID principal ID." >&2
              exit 1
            fi
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Render access parameters
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/platform-access.bicepparam \
            --out /tmp/platform-access.resolved.bicepparam \
            --set REPLACE_WITH_DEV_RUNTIME_PRINCIPAL_ID="${DEV_RUNTIME_PRINCIPAL_ID}" \
            --set REPLACE_WITH_DEV_OPS_PRINCIPAL_ID="${DEV_OPS_PRINCIPAL_ID}" \
            --set REPLACE_WITH_PROD_RUNTIME_PRINCIPAL_ID="${PROD_RUNTIME_PRINCIPAL_ID}" \
            --set REPLACE_WITH_PROD_OPS_PRINCIPAL_ID="${PROD_OPS_PRINCIPAL_ID}"

      - name: What-if platform-access.bicep
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${PLATFORM_RESOURCE_GROUP_NAME}" \
            --template-file infra/platform-access.bicep \
            --parameters /tmp/platform-access.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-platform-access.json
          if [ "$(jq '[.changes[]? | select(.changeType == "Delete")] | length' /tmp/whatif-platform-access.json)" -ne 0 ]; then
            echo "Foundry access what-if contains a Delete change; refusing to continue." >&2
            exit 1
          fi

      - name: Publish access what-if
        uses: actions/upload-artifact@v4
        with:
          name: azure-platform-access-whatif-${{ github.run_id }}
          path: /tmp/whatif-platform-access.json
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Apply Foundry workload access
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Render access parameters
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/platform-access.bicepparam \
            --out /tmp/platform-access.resolved.bicepparam \
            --set REPLACE_WITH_DEV_RUNTIME_PRINCIPAL_ID="${DEV_RUNTIME_PRINCIPAL_ID}" \
            --set REPLACE_WITH_DEV_OPS_PRINCIPAL_ID="${DEV_OPS_PRINCIPAL_ID}" \
            --set REPLACE_WITH_PROD_RUNTIME_PRINCIPAL_ID="${PROD_RUNTIME_PRINCIPAL_ID}" \
            --set REPLACE_WITH_PROD_OPS_PRINCIPAL_ID="${PROD_OPS_PRINCIPAL_ID}"

      - name: Deploy platform-access.bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${PLATFORM_RESOURCE_GROUP_NAME}" \
            --name "platform-access-${GITHUB_RUN_ID}" \
            --template-file infra/platform-access.bicep \
            --parameters /tmp/platform-access.resolved.bicepparam \
            --output none

      - name: Verify exact workload role assignments
        run: |
          set -euo pipefail
          account_id="$(az cognitiveservices account show \
            --name "${FOUNDRY_RESOURCE_NAME}" \
            --resource-group "${PLATFORM_RESOURCE_GROUP_NAME}" \
            --query id \
            --output tsv)"
          for principal_id in "${DEV_RUNTIME_PRINCIPAL_ID}" "${DEV_OPS_PRINCIPAL_ID}" "${PROD_RUNTIME_PRINCIPAL_ID}" "${PROD_OPS_PRINCIPAL_ID}"; do
            count="$(az role assignment list \
              --assignee-object-id "${principal_id}" \
              --scope "${account_id}" \
              --query "[?roleDefinitionName=='Cognitive Services OpenAI User'] | length(@)" \
              --output tsv)"
            if [ "${count}" -ne 1 ]; then
              echo "Expected one Cognitive Services OpenAI User assignment for ${principal_id}; found ${count}." >&2
              exit 1
            fi
          done
