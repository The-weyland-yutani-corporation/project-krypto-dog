name: Azure platform workload access

# Operational Foundry RBAC mutation is human-only. This workflow can verify the
# operational target with read-only Azure access, but it refuses an operational
# apply before Azure login. The protected platform OIDC identity may plan/apply
# only the dedicated account already inside its reviewed resource-group scope.
#
# Principal IDs are never dispatch inputs. Each job resolves the exact dev/prod
# runtime, ops, and scheduler UAMIs from fixed resource-group/name pairs,
# validates their resource IDs and distinct principal IDs, and then either
# applies the dedicated target or verifies direct/inherited account access.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only verification for either target, or protected apply for the dedicated target only.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply-dedicated
      foundry_account_name:
        description: Approved Foundry account. Must match the selected reviewed resource group.
        required: true
        default: ghcp-foundry-eastus2
        type: choice
        options:
          - ghcp-foundry-eastus2
          - ai-krypto-westus3
      foundry_resource_group_name:
        description: Approved Foundry resource group. Must match the selected reviewed account.
        required: true
        default: ghcp-foundry-models
        type: choice
        options:
          - ghcp-foundry-models
          - rg-krypto-platform
      reviewed_source_sha:
        description: Exact reviewed 40-hex commit SHA that must equal this workflow run's immutable source SHA.
        required: true
        type: string

concurrency:
  group: azure-platform-workload-access
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACCESS_OPERATION: ${{ inputs.operation }}
  FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
  FOUNDRY_RESOURCE_GROUP_NAME: ${{ inputs.foundry_resource_group_name }}
  REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
  COGNITIVE_SERVICES_OPENAI_USER_ROLE_ID: 5e0bd9bd-7b93-4f28-af87-19fc36ad61bd

jobs:
  plan:
    name: Plan or verify Foundry workload access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate reviewed operation and target
        run: |
          set -euo pipefail
          if ! [[ "${REVIEWED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [ "${GITHUB_SHA}" != "${REVIEWED_SOURCE_SHA}" ]; then
            echo "The workflow source must equal the exact reviewed commit SHA." >&2
            exit 1
          fi
          target_pair="${FOUNDRY_ACCOUNT_NAME}:${FOUNDRY_RESOURCE_GROUP_NAME}"
          case "${target_pair}" in
            "ghcp-foundry-eastus2:ghcp-foundry-models"|"ai-krypto-westus3:rg-krypto-platform")
              ;;
            *)
              echo "Foundry account/resource-group pair is not approved." >&2
              exit 1
              ;;
          esac
          case "${ACCESS_OPERATION}" in
            verify)
              ;;
            apply-dedicated)
              if [ "${target_pair}" != "ai-krypto-westus3:rg-krypto-platform" ]; then
                echo "Operational Foundry RBAC mutation is human-only; GitHub OIDC refuses this apply." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported access operation." >&2
              exit 1
              ;;
          esac

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve and validate fixed managed identities
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id --output tsv)"
          resolved_principal_ids=()

          resolve_identity() {
            local output_name="$1"
            local resource_group="$2"
            local identity_name="$3"
            local expected_id="/subscriptions/${subscription_id}/resourceGroups/${resource_group}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${identity_name}"
            local identity_json
            local actual_id
            local actual_type
            local principal_id

            identity_json="$(az identity show \
              --resource-group "${resource_group}" \
              --name "${identity_name}" \
              --only-show-errors \
              --output json)"
            actual_id="$(jq -er '.id' <<<"${identity_json}")"
            actual_type="$(jq -er '.type' <<<"${identity_json}")"
            principal_id="$(jq -er '.principalId' <<<"${identity_json}")"

            if [ "${actual_id,,}" != "${expected_id,,}" ]; then
              echo "${output_name} did not resolve to its fixed managed-identity resource ID." >&2
              exit 1
            fi
            if [ "${actual_type,,}" != "microsoft.managedidentity/userassignedidentities" ]; then
              echo "${output_name} is not a user-assigned managed identity." >&2
              exit 1
            fi
            if ! [[ "${principal_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "${output_name} did not resolve to a UUID principal ID." >&2
              exit 1
            fi

            printf '%s=%s\n' "${output_name}" "${principal_id}" >> "${GITHUB_ENV}"
            resolved_principal_ids+=("${principal_id}")
          }

          resolve_identity DEV_RUNTIME_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-runtime
          resolve_identity DEV_OPS_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-ops
          resolve_identity DEV_SCHEDULER_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-scheduler
          resolve_identity PROD_RUNTIME_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-runtime
          resolve_identity PROD_OPS_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-ops
          resolve_identity PROD_SCHEDULER_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-scheduler

          if [ "$(printf '%s\n' "${resolved_principal_ids[@]}" | tr '[:upper:]' '[:lower:]' | sort -u | wc -l | tr -d ' ')" -ne 6 ]; then
            echo "The four workload and two scheduler managed identities must resolve to six distinct principals." >&2
            exit 1
          fi

      - name: Render access parameters
        if: ${{ inputs.operation == 'apply-dedicated' }}
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/platform-access.bicepparam \
            --out /tmp/platform-access.resolved.bicepparam \
            --set-string-param "foundryAccountName=${FOUNDRY_ACCOUNT_NAME}"

      - name: What-if platform-access/main.bicep
        if: ${{ inputs.operation == 'apply-dedicated' }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${FOUNDRY_RESOURCE_GROUP_NAME}" \
            --template-file infra/platform-access/main.bicep \
            --parameters /tmp/platform-access.resolved.bicepparam \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > /tmp/whatif-platform-access.json
          if [ "$(jq '[.changes[]? | select(.changeType == "Delete")] | length' /tmp/whatif-platform-access.json)" -ne 0 ]; then
            echo "Foundry access what-if contains a Delete change; refusing to continue." >&2
            exit 1
          fi

      - name: Publish access what-if
        if: ${{ inputs.operation == 'apply-dedicated' }}
        uses: actions/upload-artifact@v4
        with:
          name: azure-platform-access-whatif-${{ github.run_id }}
          path: /tmp/whatif-platform-access.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify exact direct and inherited Foundry access
        if: ${{ inputs.operation == 'verify' }}
        run: |
          set -euo pipefail
          account_json="$(az cognitiveservices account show \
            --name "${FOUNDRY_ACCOUNT_NAME}" \
            --resource-group "${FOUNDRY_RESOURCE_GROUP_NAME}" \
            --only-show-errors \
            --output json)"
          account_id="$(jq -er '.id' <<<"${account_json}")"
          subscription_id="$(az account show --query id --output tsv)"
          expected_account_id="/subscriptions/${subscription_id}/resourceGroups/${FOUNDRY_RESOURCE_GROUP_NAME}/providers/Microsoft.CognitiveServices/accounts/${FOUNDRY_ACCOUNT_NAME}"
          role_definition_id="/subscriptions/${subscription_id}/providers/Microsoft.Authorization/roleDefinitions/${COGNITIVE_SERVICES_OPENAI_USER_ROLE_ID}"

          if [ "${account_id,,}" != "${expected_account_id,,}" ]; then
            echo "Foundry account did not resolve to the exact reviewed resource ID." >&2
            exit 1
          fi
          if ! jq -e '.properties.disableLocalAuth == true' <<<"${account_json}" >/dev/null; then
            echo "Foundry account still permits key-based local authentication; RBAC verification is not an access boundary." >&2
            exit 1
          fi

          collect_direct_assignments() {
            local principal_id="$1"
            local request_url="${account_id}/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01&%24filter=assignedTo%28%27${principal_id}%27%29"
            local collected='[]'
            local page
            local page_count=0

            while [ -n "${request_url}" ]; do
              page_count=$((page_count + 1))
              if [ "${page_count}" -gt 100 ]; then
                echo "Role-assignment pagination exceeded the fail-closed page limit." >&2
                exit 1
              fi
              case "${request_url}" in
                /subscriptions/*|https://management.azure.com/*)
                  ;;
                *)
                  echo "Role-assignment nextLink did not remain on Azure Resource Manager." >&2
                  exit 1
                  ;;
              esac
              page="$(az rest \
                --method get \
                --url "${request_url}" \
                --only-show-errors \
                --output json)"
              if ! jq -e \
                '((.value | type) == "array") and (((.nextLink // "") | type) == "string")' \
                <<<"${page}" >/dev/null; then
                echo "Role-assignment response did not have the expected paged ARM shape." >&2
                exit 1
              fi
              collected="$(jq -cn \
                --argjson collected "${collected}" \
                --argjson page "${page}" \
                '$collected + $page.value')"
              request_url="$(jq -r '.nextLink // empty' <<<"${page}")"
            done

            printf '%s\n' "${collected}"
          }

          verify_workload() {
            local label="$1"
            local principal_id="$2"
            local direct_assignments
            local effective_assignments
            local assignments
            effective_assignments="$(az role assignment list \
              --assignee-object-id "${principal_id}" \
              --scope "${account_id}" \
              --include-inherited \
              --fill-principal-name false \
              --fill-role-definition-name false \
              --only-show-errors \
              --output json)"
            direct_assignments="$(collect_direct_assignments "${principal_id}")"
            assignments="$(jq -cn \
              --arg account_id "${account_id,,}" \
              --argjson effective "${effective_assignments}" \
              --argjson direct "${direct_assignments}" \
              --from-file scripts/azure/filter-foundry-role-assignments.jq)"
            if ! jq -e \
              --arg scope "${account_id}" \
              --arg role_definition_id "${role_definition_id}" \
              --arg principal_id "${principal_id}" \
              '
                (length == 1) and
                ((.[0].scope // "" | ascii_downcase) == ($scope | ascii_downcase)) and
                ((.[0].roleDefinitionId // "" | ascii_downcase) == ($role_definition_id | ascii_downcase)) and
                ((.[0].principalId // "" | ascii_downcase) == ($principal_id | ascii_downcase)) and
                (.[0].principalType == "ServicePrincipal")
              ' <<<"${assignments}" >/dev/null; then
              echo "${label} must have exactly one direct/effective assignment: account-scoped Cognitive Services OpenAI User." >&2
              exit 1
            fi
          }

          verify_scheduler() {
            local label="$1"
            local principal_id="$2"
            local direct_assignments
            local effective_assignments
            local assignments
            effective_assignments="$(az role assignment list \
              --assignee-object-id "${principal_id}" \
              --scope "${account_id}" \
              --include-inherited \
              --fill-principal-name false \
              --fill-role-definition-name false \
              --only-show-errors \
              --output json)"
            direct_assignments="$(collect_direct_assignments "${principal_id}")"
            assignments="$(jq -cn \
              --arg account_id "${account_id,,}" \
              --argjson effective "${effective_assignments}" \
              --argjson direct "${direct_assignments}" \
              --from-file scripts/azure/filter-foundry-role-assignments.jq)"
            if ! jq -e 'length == 0' <<<"${assignments}" >/dev/null; then
              echo "${label} must have zero direct or inherited Foundry assignments." >&2
              exit 1
            fi
          }

          verify_workload "dev runtime" "${DEV_RUNTIME_PRINCIPAL_ID}"
          verify_workload "dev ops" "${DEV_OPS_PRINCIPAL_ID}"
          verify_workload "prod runtime" "${PROD_RUNTIME_PRINCIPAL_ID}"
          verify_workload "prod ops" "${PROD_OPS_PRINCIPAL_ID}"
          verify_scheduler "dev scheduler" "${DEV_SCHEDULER_PRINCIPAL_ID}"
          verify_scheduler "prod scheduler" "${PROD_SCHEDULER_PRINCIPAL_ID}"

  apply:
    name: Apply dedicated Foundry workload access
    if: ${{ inputs.operation == 'apply-dedicated' && inputs.foundry_account_name == 'ai-krypto-westus3' && inputs.foundry_resource_group_name == 'rg-krypto-platform' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate reviewed workflow source
        run: |
          set -euo pipefail
          if ! [[ "${REVIEWED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [ "${GITHUB_SHA}" != "${REVIEWED_SOURCE_SHA}" ]; then
            echo "The workflow source must equal the exact reviewed commit SHA." >&2
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve and validate fixed managed identities
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id --output tsv)"
          resolved_principal_ids=()

          resolve_identity() {
            local output_name="$1"
            local resource_group="$2"
            local identity_name="$3"
            local expected_id="/subscriptions/${subscription_id}/resourceGroups/${resource_group}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${identity_name}"
            local identity_json
            local actual_id
            local actual_type
            local principal_id

            identity_json="$(az identity show \
              --resource-group "${resource_group}" \
              --name "${identity_name}" \
              --only-show-errors \
              --output json)"
            actual_id="$(jq -er '.id' <<<"${identity_json}")"
            actual_type="$(jq -er '.type' <<<"${identity_json}")"
            principal_id="$(jq -er '.principalId' <<<"${identity_json}")"

            if [ "${actual_id,,}" != "${expected_id,,}" ]; then
              echo "${output_name} did not resolve to its fixed managed-identity resource ID." >&2
              exit 1
            fi
            if [ "${actual_type,,}" != "microsoft.managedidentity/userassignedidentities" ]; then
              echo "${output_name} is not a user-assigned managed identity." >&2
              exit 1
            fi
            if ! [[ "${principal_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "${output_name} did not resolve to a UUID principal ID." >&2
              exit 1
            fi

            printf '%s=%s\n' "${output_name}" "${principal_id}" >> "${GITHUB_ENV}"
            resolved_principal_ids+=("${principal_id}")
          }

          resolve_identity DEV_RUNTIME_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-runtime
          resolve_identity DEV_OPS_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-ops
          resolve_identity DEV_SCHEDULER_PRINCIPAL_ID rg-krypto-dev id-krypto-dev-scheduler
          resolve_identity PROD_RUNTIME_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-runtime
          resolve_identity PROD_OPS_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-ops
          resolve_identity PROD_SCHEDULER_PRINCIPAL_ID rg-krypto-prod id-krypto-prod-scheduler

          if [ "$(printf '%s\n' "${resolved_principal_ids[@]}" | tr '[:upper:]' '[:lower:]' | sort -u | wc -l | tr -d ' ')" -ne 6 ]; then
            echo "The four workload and two scheduler managed identities must resolve to six distinct principals." >&2
            exit 1
          fi

      - name: Render access parameters
        run: |
          set -euo pipefail
          node .github/scripts/azure/render-bicepparam.mjs \
            --template infra/params/platform-access.bicepparam \
            --out /tmp/platform-access.resolved.bicepparam \
            --set-string-param "foundryAccountName=${FOUNDRY_ACCOUNT_NAME}"

      - name: Deploy platform-access/main.bicep to dedicated target
        run: |
          set -euo pipefail
          if [ "${FOUNDRY_ACCOUNT_NAME}:${FOUNDRY_RESOURCE_GROUP_NAME}" != "ai-krypto-westus3:rg-krypto-platform" ]; then
            echo "GitHub OIDC may deploy platform access only to the dedicated reviewed target." >&2
            exit 1
          fi
          az deployment group create \
            --resource-group "${FOUNDRY_RESOURCE_GROUP_NAME}" \
            --name "platform-access-${GITHUB_RUN_ID}" \
            --template-file infra/platform-access/main.bicep \
            --parameters /tmp/platform-access.resolved.bicepparam \
            --output none

      - name: Verify exact direct and inherited Foundry access
        run: |
          set -euo pipefail
          account_json="$(az cognitiveservices account show \
            --name "${FOUNDRY_ACCOUNT_NAME}" \
            --resource-group "${FOUNDRY_RESOURCE_GROUP_NAME}" \
            --only-show-errors \
            --output json)"
          account_id="$(jq -er '.id' <<<"${account_json}")"
          subscription_id="$(az account show --query id --output tsv)"
          expected_account_id="/subscriptions/${subscription_id}/resourceGroups/${FOUNDRY_RESOURCE_GROUP_NAME}/providers/Microsoft.CognitiveServices/accounts/${FOUNDRY_ACCOUNT_NAME}"
          role_definition_id="/subscriptions/${subscription_id}/providers/Microsoft.Authorization/roleDefinitions/${COGNITIVE_SERVICES_OPENAI_USER_ROLE_ID}"

          if [ "${account_id,,}" != "${expected_account_id,,}" ]; then
            echo "Foundry account did not resolve to the exact reviewed resource ID." >&2
            exit 1
          fi
          if ! jq -e '.properties.disableLocalAuth == true' <<<"${account_json}" >/dev/null; then
            echo "Foundry account still permits key-based local authentication; RBAC verification is not an access boundary." >&2
            exit 1
          fi

          collect_direct_assignments() {
            local principal_id="$1"
            local request_url="${account_id}/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01&%24filter=assignedTo%28%27${principal_id}%27%29"
            local collected='[]'
            local page
            local page_count=0

            while [ -n "${request_url}" ]; do
              page_count=$((page_count + 1))
              if [ "${page_count}" -gt 100 ]; then
                echo "Role-assignment pagination exceeded the fail-closed page limit." >&2
                exit 1
              fi
              case "${request_url}" in
                /subscriptions/*|https://management.azure.com/*)
                  ;;
                *)
                  echo "Role-assignment nextLink did not remain on Azure Resource Manager." >&2
                  exit 1
                  ;;
              esac
              page="$(az rest \
                --method get \
                --url "${request_url}" \
                --only-show-errors \
                --output json)"
              if ! jq -e \
                '((.value | type) == "array") and (((.nextLink // "") | type) == "string")' \
                <<<"${page}" >/dev/null; then
                echo "Role-assignment response did not have the expected paged ARM shape." >&2
                exit 1
              fi
              collected="$(jq -cn \
                --argjson collected "${collected}" \
                --argjson page "${page}" \
                '$collected + $page.value')"
              request_url="$(jq -r '.nextLink // empty' <<<"${page}")"
            done

            printf '%s\n' "${collected}"
          }

          verify_workload() {
            local label="$1"
            local principal_id="$2"
            local direct_assignments
            local effective_assignments
            local assignments
            effective_assignments="$(az role assignment list \
              --assignee-object-id "${principal_id}" \
              --scope "${account_id}" \
              --include-inherited \
              --fill-principal-name false \
              --fill-role-definition-name false \
              --only-show-errors \
              --output json)"
            direct_assignments="$(collect_direct_assignments "${principal_id}")"
            assignments="$(jq -cn \
              --arg account_id "${account_id,,}" \
              --argjson effective "${effective_assignments}" \
              --argjson direct "${direct_assignments}" \
              --from-file scripts/azure/filter-foundry-role-assignments.jq)"
            if ! jq -e \
              --arg scope "${account_id}" \
              --arg role_definition_id "${role_definition_id}" \
              --arg principal_id "${principal_id}" \
              '
                (length == 1) and
                ((.[0].scope // "" | ascii_downcase) == ($scope | ascii_downcase)) and
                ((.[0].roleDefinitionId // "" | ascii_downcase) == ($role_definition_id | ascii_downcase)) and
                ((.[0].principalId // "" | ascii_downcase) == ($principal_id | ascii_downcase)) and
                (.[0].principalType == "ServicePrincipal")
              ' <<<"${assignments}" >/dev/null; then
              echo "${label} must have exactly one direct/effective assignment: account-scoped Cognitive Services OpenAI User." >&2
              exit 1
            fi
          }

          verify_scheduler() {
            local label="$1"
            local principal_id="$2"
            local direct_assignments
            local effective_assignments
            local assignments
            effective_assignments="$(az role assignment list \
              --assignee-object-id "${principal_id}" \
              --scope "${account_id}" \
              --include-inherited \
              --fill-principal-name false \
              --fill-role-definition-name false \
              --only-show-errors \
              --output json)"
            direct_assignments="$(collect_direct_assignments "${principal_id}")"
            assignments="$(jq -cn \
              --arg account_id "${account_id,,}" \
              --argjson effective "${effective_assignments}" \
              --argjson direct "${direct_assignments}" \
              --from-file scripts/azure/filter-foundry-role-assignments.jq)"
            if ! jq -e 'length == 0' <<<"${assignments}" >/dev/null; then
              echo "${label} must have zero direct or inherited Foundry assignments." >&2
              exit 1
            fi
          }

          verify_workload "dev runtime" "${DEV_RUNTIME_PRINCIPAL_ID}"
          verify_workload "dev ops" "${DEV_OPS_PRINCIPAL_ID}"
          verify_workload "prod runtime" "${PROD_RUNTIME_PRINCIPAL_ID}"
          verify_workload "prod ops" "${PROD_OPS_PRINCIPAL_ID}"
          verify_scheduler "dev scheduler" "${DEV_SCHEDULER_PRINCIPAL_ID}"
          verify_scheduler "prod scheduler" "${PROD_SCHEDULER_PRINCIPAL_ID}"
