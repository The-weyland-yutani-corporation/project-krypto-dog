services:
  db:
    image: postgres:17-alpine
    container_name: krypto-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: krypto
      POSTGRES_PASSWORD: krypto_local
      POSTGRES_DB: krypto
    volumes:
      - pgdata17:/var/lib/postgresql/data

volumes:
  pgdata17:
